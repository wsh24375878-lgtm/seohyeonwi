<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archive — SEOHYEON WI™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Archive — a timeline of every work.
   Years run left to right, each a column between thin vertical rules; the works of that year are
   stacked above and below one horizontal axis like a bar chart (taller stacks = busier years),
   with small italic captions along the bottom. Scroll / drag sideways; hover a picture for its name,
   click to open it; the filter at the top right lights up one category.
   ========================================================= */
:root{ --ink:#050505; --muted:#8c8c8c; --rule:#bdbdbd; --pad:24px; --tile:88px; --gap:6px;
  --serif:'Instrument Serif','Times New Roman',serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- head ---------- */
.head{position:fixed;z-index:20;left:var(--pad);right:var(--pad);top:54px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.title{margin:0;font-weight:400;font-size:clamp(26px,3.25vw,56px);line-height:1.05;letter-spacing:-.04em}
.title sup{font-size:.3em;letter-spacing:0;color:var(--muted);vertical-align:top;margin-left:.25em;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:16px;font-size:15px;line-height:1;pointer-events:auto}
.filters button{color:var(--muted);transition:color .2s ease}
.filters button:hover,.filters button.on{color:var(--ink)}
.filters button.on{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.filters sup{font-size:9px;margin-left:2px}

/* ---------- timeline ---------- */
.scroller{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;touch-action:pan-x}
.scroller::-webkit-scrollbar{display:none}
.scroller.dragging{cursor:grabbing}
.track{position:relative;display:flex;height:100%;padding:0 var(--pad);width:max-content;min-width:100%}
.axis{position:absolute;left:0;right:0;top:var(--axis);height:1px;background:var(--ink);opacity:.55;pointer-events:none}
.phase{position:relative;display:flex;gap:var(--gap);padding:0 22px;border-left:1px solid var(--rule);height:100%}
.phase:last-child{border-right:1px solid var(--rule)}
.col{position:relative;width:var(--w);height:100%}
.up,.down{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:var(--gap)}
.up{bottom:calc(100% - var(--axis) + 4px);flex-direction:column-reverse}
.down{top:calc(var(--axis) + 4px)}
.tile{display:block;width:100%;background:#f1f1f1;overflow:hidden;
  transform:scaleY(0);transition:transform .7s cubic-bezier(.16,1,.3,1),opacity .3s ease,filter .3s ease}
.up .tile{transform-origin:50% 100%}
.down .tile{transform-origin:50% 0}
.in .tile{transform:none}
.tile img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
.track.hovering .tile{opacity:.35}
.track.hovering .tile.is-hover{opacity:1}
.tile.off{opacity:.12!important;filter:grayscale(1)}
.label{position:absolute;left:22px;bottom:64px;font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.15;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.label span{display:block;color:var(--muted)}

/* ---------- hover caption ---------- */
.cap{position:fixed;z-index:30;left:0;top:0;pointer-events:none;font-size:13px;line-height:1.3;background:#fff;padding:4px 6px;white-space:nowrap;
  opacity:0;transform:translate(14px,14px);transition:opacity .2s ease}
.cap.show{opacity:1}
.cap small{display:block;color:var(--muted);font-size:11px}
@media (hover:none){.cap{display:none}}

.hint{position:fixed;z-index:20;right:var(--pad);bottom:28px;font-size:13px;color:var(--muted);pointer-events:none}

@media (max-width:700px){
  :root{--pad:14px;--tile:64px;--gap:4px}
  .head{top:66px;flex-direction:column;gap:12px}
  .filters{gap:12px;font-size:12px;flex-wrap:wrap}
  .phase{padding:0 12px}
  .label{left:12px;bottom:56px;font-size:11px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none;transform:none}}
</style>
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="site-cursor.css">
</head>
<body>
<header class="site-top">
  <a class="site-name" href="index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="fashion.html">Fashion</a>
    <a href="portfolio_with_detail_pages/index.html">3D</a>
    <a href="portfolio_with_detail_pages/index.html?cat=product">Product</a>
    <a href="graphic.html">Graphic</a>
    <a href="seohyeon_wi_projects_interactive_v2.html" class="is-active" aria-current="page">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="head">
  <h1 class="title">Archive<sup id="total"></sup></h1>
  <div class="filters" id="filters" aria-label="Category"></div>
</div>

<div class="scroller" id="scroller" aria-label="Timeline of all work — scroll sideways">
  <div class="track" id="track"><div class="axis" aria-hidden="true"></div></div>
</div>
<div class="cap" id="cap" aria-hidden="true"></div>
<div class="hint" aria-hidden="true">Scroll →</div>
<div class="cursor" aria-hidden="true"></div>

<script src="fashion-data.js"></script>
<script src="works-data.js"></script>
<script>
(() => {
  const ORDER = ['all', 'fashion', 'object', 'product', 'graphic'];
  const NAMES = { all: 'All', ...WorksData.CATEGORY_NAMES };
  const track = document.getElementById('track'), scroller = document.getElementById('scroller');
  const cap = document.getElementById('cap');
  let works = [], cat = 'all';

  /* ---------- layout ----------
     the axis sits a little below the middle; each year's works fill columns of tiles, each column
     stacking upward from the axis and downward from it until there is no more room, then the next column */
  const axisRatio = () => innerWidth <= 700 ? .5 : .54;
  function build() {
    track.querySelectorAll('.phase').forEach(n => n.remove());
    const H = innerHeight, axis = Math.round(H * axisRatio());
    track.style.setProperty('--axis', axis + 'px');
    const tileW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile')) || 88;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 6;
    const roomUp = axis - (innerWidth <= 700 ? 190 : 150);        // keep clear of the menu and title
    const roomDown = H - axis - 130;                               // keep clear of the captions

    const years = new Map();
    works.forEach(w => { const y = parseInt(w.year, 10) || 0; if (!years.has(y)) years.set(y, []); years.get(y).push(w); });
    const keys = [...years.keys()].sort((a, b) => (a || 9999) - (b || 9999));
    let delay = 0;
    keys.forEach(y => {
      const list = years.get(y);
      const phase = document.createElement('section');
      phase.className = 'phase';
      // columns: alternate up / down so both sides grow evenly
      let col = null, upH = 0, downH = 0, side = 0;
      const newCol = (i) => {
        col = document.createElement('div'); col.className = 'col';
        const w = Math.round(tileW * (.86 + ((i * 7) % 5) * .07));       // a little variety in width, like the reference
        col.style.setProperty('--w', w + 'px'); col._w = w;
        col.innerHTML = '<div class="up"></div><div class="down"></div>';
        phase.appendChild(col); upH = 0; downH = 0; side = 0;
      };
      list.forEach((w, i) => {
        const img = w.images[0];
        if (!col) newCol(i);
        let h = Math.round(col._w / Math.max(.45, Math.min(2.2, img ? img.ar : .8)));
        const fitsUp = upH + h + gap <= roomUp, fitsDown = downH + h + gap <= roomDown;
        let where = side % 2 === 0 ? 'up' : 'down';
        if (where === 'up' && !fitsUp) where = fitsDown ? 'down' : null;
        else if (where === 'down' && !fitsDown) where = fitsUp ? 'up' : null;
        if (!where) { newCol(i + 1); h = Math.round(col._w / Math.max(.45, Math.min(2.2, img ? img.ar : .8))); where = 'up'; }
        const a = document.createElement('a');
        a.className = 'tile'; a.href = w.url; a.style.height = h + 'px';
        a.dataset.cat = w.category; a._w = w;
        a.style.transitionDelay = (delay += 18) + 'ms';
        a.innerHTML = `<img src="${img ? img.url : ''}" alt="${w.title}" loading="lazy" draggable="false">`;
        col.querySelector('.' + where).appendChild(a);
        if (where === 'up') upH += h + gap; else downH += h + gap;
        side++;
      });
      const cats = [...new Set(list.map(w => w.categoryName))].join(' · ');
      const lab = document.createElement('p');
      lab.className = 'label';
      lab.innerHTML = `${y ? 'Year ' + y : 'Undated'}<span>${cats}</span>`;
      phase.appendChild(lab);
      track.appendChild(phase);
    });
    applyFilter();
    requestAnimationFrame(() => requestAnimationFrame(() => track.classList.add('in')));
  }

  /* ---------- filter: one category stays lit, the rest go quiet ---------- */
  function renderFilters() {
    const f = document.getElementById('filters'); f.innerHTML = '';
    ORDER.forEach(k => {
      const n = k === 'all' ? works.length : works.filter(w => w.category === k).length;
      if (!n && k !== 'all') return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = k === cat ? 'on' : ''; b.innerHTML = `${NAMES[k]}<sup>${n}</sup>`;
      b.addEventListener('click', () => { cat = k; renderFilters(); applyFilter(); });
      f.appendChild(b);
    });
    document.getElementById('total').textContent = String(works.length).padStart(2, '0');
  }
  function applyFilter() { track.querySelectorAll('.tile').forEach(t => t.classList.toggle('off', cat !== 'all' && t.dataset.cat !== cat)); }

  /* ---------- hover: name by the cursor, the rest step back ---------- */
  let hover = null;
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    cap.style.left = e.clientX + 'px'; cap.style.top = e.clientY + 'px';
    const t = e.target.closest && e.target.closest('.tile');
    if (t === hover) return;
    hover?.classList.remove('is-hover'); hover = t;
    track.classList.toggle('hovering', !!t);
    if (t) { t.classList.add('is-hover'); const w = t._w; cap.innerHTML = `${w.title}<small>${[w.categoryName, w.year].filter(Boolean).join(', ')}</small>`; }
    cap.classList.toggle('show', !!t);
  });

  /* ---------- sideways: the wheel scrolls the timeline, the mouse can drag it ---------- */
  let tx = 0, raf = 0;
  scroller.addEventListener('wheel', e => {
    e.preventDefault();
    tx = Math.max(0, Math.min(scroller.scrollWidth - scroller.clientWidth, (raf ? tx : scroller.scrollLeft) + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY)));
    if (!raf) raf = requestAnimationFrame(function glide() {
      const d = tx - scroller.scrollLeft; scroller.scrollLeft += d * .16;
      raf = Math.abs(d) > .5 ? requestAnimationFrame(glide) : 0;
    });
  }, { passive: false });
  let drag = null;
  scroller.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0) return; drag = { x: e.clientX, l: scroller.scrollLeft, moved: false }; });
  addEventListener('pointermove', e => {
    if (!drag) return; const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; scroller.classList.add('dragging'); }
    if (drag.moved) { scroller.scrollLeft = drag.l - dx; tx = scroller.scrollLeft; }
  });
  addEventListener('pointerup', () => {
    if (!drag) return; const moved = drag.moved; drag = null; scroller.classList.remove('dragging');
    if (moved) scroller.addEventListener('click', ev => ev.preventDefault(), { once: true, capture: true });
  });

  let resizeT = 0;
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { track.classList.remove('in'); build(); }, 200); });

  WorksData.loadAll().then(list => {
    works = list.filter(w => w.images && w.images[0]);
    renderFilters(); build();
  });
})();
</script>
<script src="site-clock.js"></script>
<script src="site-cursor.js"></script>
</body>
</html>
