<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archive — SEOHYEON WI™</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#050505;font-family:Arial,Helvetica,sans-serif;font-weight:400}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p,h2{margin:0}

/* white strip behind the fixed top bar while scrolling */
.top-fade{position:fixed;top:0;left:0;right:0;height:46px;background:#fff;z-index:99}

.page{padding:46px 24px 80px}

/* ---------- filters (stay under the top bar) ---------- */
.filters{position:sticky;top:46px;z-index:50;display:flex;flex-wrap:wrap;gap:6px 22px;padding:8px 0 18px;background:#fff;font-size:15px;line-height:1}
.filter{all:unset;cursor:pointer;color:#8c8c8c;transition:color .2s ease}
.filter:hover,.filter.is-active{color:#050505}
.filter.is-active .name{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.filter .count{font-size:10px;vertical-align:top;margin-left:2px;font-variant-numeric:tabular-nums}
.filter:focus-visible{outline:2px solid #777;outline-offset:3px}

/* ---------- one row per project ---------- */
.list{border-top:1px solid #050505}
.row{display:grid;grid-template-columns:minmax(180px,1fr) 4fr;gap:24px;padding:18px 0 20px;border-bottom:1px solid #e7e7e7;opacity:0;transform:translateY(12px);transition:opacity .5s cubic-bezier(.33,1,.68,1),transform .5s cubic-bezier(.33,1,.68,1)}
.row.is-in{opacity:1;transform:none}
.meta{font-size:15px;line-height:1.3}
.meta .num{display:block;margin-bottom:10px;font-variant-numeric:tabular-nums}
.meta .title{display:block}
.meta .title:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.muted{color:#8c8c8c}

.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:-24px;padding-right:24px}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:0 0 auto;display:block;height:200px;background:#e5e5e5;border-radius:2px;overflow:hidden}
.strip img{display:block;height:100%;width:auto;-webkit-user-drag:none;transition:opacity .25s ease}
.strip:hover img{opacity:.55}
.strip a:hover img{opacity:1}

.empty{padding:40px 0;font-size:15px;color:#8c8c8c}

@media (max-width:700px){
  .top-fade{height:62px}
  .page{padding:62px 14px 56px}
  .filters{top:62px;gap:6px 14px;font-size:12px;padding:6px 0 14px}
  .row{grid-template-columns:1fr;gap:10px;padding:14px 0 16px}
  .meta{font-size:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .meta .num{display:inline;margin:0}
  .strip{margin-right:-14px;padding-right:14px}
  .strip a{height:140px}
}
</style>
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="site-cursor.css">
</head>
<body>
<div class="top-fade" aria-hidden="true"></div>
<header class="site-top">
  <a class="site-name" href="index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="fashion.html">Fashion</a>
    <a href="portfolio_with_detail_pages/index.html">Object</a>
    <a href="graphic.html">Graphic</a>
    <a href="seohyeon_wi_projects_interactive_v2.html" data-filter="all">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="page">
  <div class="filters" id="filters" role="tablist" aria-label="Filter work by category"></div>
  <section class="list" id="list" aria-live="polite"></section>
</main>
<div class="cursor" aria-hidden="true"></div>

<script src="fashion-data.js"></script>
<script src="works-data.js"></script>
<script>
(() => {
  const ORDER = ['all', 'fashion', 'object', 'graphic'];
  const NAMES = { all: 'All', ...WorksData.CATEGORY_NAMES };
  const filtersEl = document.getElementById('filters');
  const listEl = document.getElementById('list');
  const param = new URLSearchParams(location.search).get('category');
  let current = ORDER.includes(param) ? param : 'all';
  let works = [];

  // the top bar underlines Graphic when filtered to it, otherwise Archive
  function markTopBar() {
    const key = 'all';
    document.querySelectorAll('.site-cats a[data-filter]').forEach(a => {
      const on = a.dataset.filter === key;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function renderFilters() {
    filtersEl.innerHTML = '';
    ORDER.forEach(key => {
      const count = key === 'all' ? works.length : works.filter(w => w.category === key).length;
      const b = document.createElement('button');
      b.className = 'filter' + (key === current ? ' is-active' : '');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(key === current));
      b.innerHTML = `<span class="name">${NAMES[key]}</span><span class="count">${count}</span>`;
      b.addEventListener('click', () => setFilter(key));
      filtersEl.appendChild(b);
    });
  }

  function renderList() {
    const shown = current === 'all' ? works : works.filter(w => w.category === current);
    listEl.innerHTML = '';
    if (!shown.length) { listEl.innerHTML = '<p class="empty">No work here yet.</p>'; return; }
    shown.forEach((w, i) => {
      const row = document.createElement('article');
      row.className = 'row';
      const meta = [w.categoryName, w.info, w.year].filter(Boolean).join(' · ');
      row.innerHTML =
        `<div class="meta"><span class="num muted">${String(i + 1).padStart(2, '0')}</span>` +
        `<a class="title" href="${w.url}">${w.title}</a><span class="muted">${meta}</span></div>` +
        `<div class="strip">${w.images.map((im, k) =>
          `<a href="${w.url}" aria-label="${w.title}, image ${k + 1}" style="aspect-ratio:${im.ar}"><img src="${im.url}" alt="" loading="lazy"></a>`).join('')}</div>`;
      listEl.appendChild(row);
      setTimeout(() => row.classList.add('is-in'), 40 + i * 45);   // rows rise in one after another
      enableDragScroll(row.querySelector('.strip'));
    });
  }

  function setFilter(key) {
    if (key === current) return;
    current = key;
    history.replaceState(null, '', key === 'all' ? 'seohyeon_wi_projects_interactive_v2.html' : `seohyeon_wi_projects_interactive_v2.html?category=${key}`);
    document.title = `${key === 'all' ? 'Archive' : NAMES[key]} — SEOHYEON WI™`;
    markTopBar();
    renderFilters();
    renderList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Graphic / Archive in the top bar just switch the filter on this page
  document.querySelectorAll('.site-cats a[data-filter]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); setFilter(a.dataset.filter); });
  });

  // drag the image rows sideways with the mouse (touch scrolls natively)
  function enableDragScroll(strip) {
    let down = false, startX = 0, startLeft = 0, moved = 0;
    strip.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      down = true; moved = 0; startX = e.clientX; startLeft = strip.scrollLeft;
    });
    addEventListener('pointermove', e => {
      if (!down) return;
      moved = Math.max(moved, Math.abs(e.clientX - startX));
      strip.scrollLeft = startLeft - (e.clientX - startX);
    });
    addEventListener('pointerup', () => { down = false; });
    strip.addEventListener('click', e => { if (moved > 6) { e.preventDefault(); moved = 0; } }, true);
  }

  document.title = `${current === 'all' ? 'Archive' : NAMES[current]} — SEOHYEON WI™`;
  markTopBar();
  WorksData.loadAll().then(list => {
    works = list;
    renderFilters();
    renderList();
  });
})();
</script>
<script src="site-cursor.js"></script>
</body>
</html>
