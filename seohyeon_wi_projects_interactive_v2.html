(()=>{const track=document.getElementById('track'),zone=document.getElementById('speedZone'),zoneLeft=document.getElementById('speedZoneLeft');let position=-90,currentSpeed=.18,targetSpeed=.18,last=performance.now();const baseSpeed=.18,hoverSpeed=baseSpeed*25;zone.addEventListener('mouseenter',()=>{targetSpeed=hoverSpeed;zone.classList.add('active')});zone.addEventListener('mouseleave',()=>{targetSpeed=baseSpeed;zone.classList.remove('active')});zone.addEventListener('touchstart',()=>{targetSpeed=hoverSpeed;zone.classList.add('active')},{passive:true});zone.addEventListener('touchend',()=>{targetSpeed=baseSpeed;zone.classList.remove('active')},{passive:true});zoneLeft.addEventListener('mouseenter',()=>{targetSpeed=-hoverSpeed;zoneLeft.classList.add('active')});zoneLeft.addEventListener('mouseleave',()=>{targetSpeed=baseSpeed;zoneLeft.classList.remove('active')});zoneLeft.addEventListener('touchstart',()=>{targetSpeed=-hoverSpeed;zoneLeft.classList.add('active')},{passive:true});zoneLeft.addEventListener('touchend',()=>{targetSpeed=baseSpeed;zoneLeft.classList.remove('active')},{passive:true});function animate(now){const dt=Math.min((now-last)/16.6667,2);last=now;currentSpeed+=(targetSpeed-currentSpeed)*.05;position+=currentSpeed*dt;const w=track.scrollWidth;if(position>0)position-=w*.42;else if(position<-w*.42)position+=w*.42;track.style.transform=`translate3d(${position}px,0,0)`;requestAnimationFrame(animate)}requestAnimationFrame(animate);document.querySelector('.back-button').addEventListener('click',()=>{window.location.href='index.html'})})();
</script>
<script>
document.querySelectorAll('.track .card').forEach((card, index) => {
  const project = String(index % 8 + 1).padStart(2, '0');
  const link = document.createElement('a');
  link.className = card.className;
  link.href = `project-detail.html?project=${project}`;
  link.setAttribute('aria-label', `View Project ${project}`);

  while (card.firstChild) {
    link.appendChild(card.firstChild);
  }
  card.parentNode.replaceChild(link, card);
});
</script>
