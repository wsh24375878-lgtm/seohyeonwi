<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archive — SEOHYEON WI™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Archive — image grid
   Centred heading, 3:4 tiles in 3 / 2 / 1 columns, small title + serif
   category under each tile, "View" label following the cursor,
   eased scrolling and soft glass bands at the top and bottom edge.
   (The previous design is saved as ../_archive-original-design-20261120.html)
   ========================================================= */
:root{
  --ink:#0a0a0a; --muted:#8c8c8c; --skeleton:#ededed;
  --chip:rgba(237,237,237,.5);
  --pad:8px; --col-gap:8px; --row-gap:40px; --cols:3;
  --serif:'Instrument Serif','Times New Roman',serif;
  --sans:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p,h1,h2{margin:0;font-weight:400}

/* eased scrolling: the page keeps its real height, the content is drawn fixed and glides to the scroll position */
.scroller{position:fixed;top:0;left:0;width:100%;will-change:transform}
body.native .scroller{position:static;transform:none!important}

/* ---------- heading ---------- */
.head{padding:200px var(--pad) 80px;text-align:center}
.head-line{font-size:16px;line-height:1.2;letter-spacing:-.01em}
.head-line .serif{font-family:var(--serif);font-size:17px}
.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin-top:22px}
.filter{all:unset;cursor:pointer;padding:6px 8px 4px;border-radius:4px;background:var(--chip);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);font-size:12px;line-height:1;color:var(--muted);transition:color .2s ease,background-color .2s ease}
.filter:hover{color:var(--ink)}
.filter.is-active{color:var(--ink);background:#e4e4e4}
.filter sup{font-size:9px;margin-left:2px;font-variant-numeric:tabular-nums}
.filter:focus-visible{outline:2px solid #777;outline-offset:2px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);column-gap:var(--col-gap);row-gap:var(--row-gap);padding:0 var(--pad)}
.tile{display:block;cursor:none}
.tile-media{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--skeleton)}
.tile-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;
  opacity:0;filter:blur(18px);transform:scale(1.04);transition:opacity .6s ease,filter .6s ease,transform .9s cubic-bezier(.16,1,.3,1)}
.tile-media img.is-loaded{opacity:1;filter:blur(0);transform:none}
/* hover: a second image (when there is one) fades in through a blur */
.tile-media img.alt{opacity:0;filter:blur(18px)}
.tile.is-hover .tile-media img.alt.is-loaded{opacity:1;filter:blur(0)}
.tile.is-hover .tile-media img.main.has-alt{filter:blur(10px)}
.chips{position:absolute;top:8px;left:8px;z-index:2;display:flex;gap:2px}
.chip{padding:6px 8px 4px;border-radius:4px;background:var(--chip);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);font-size:12px;line-height:1}
.tile-title{margin-top:12px;font-size:12px;line-height:1.2}
.tile-cat{margin-top:6px;padding-bottom:6px;font-family:var(--serif);font-size:13px;line-height:1.2;color:var(--muted)}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- footer ---------- */
.foot{padding:240px var(--pad) 20px;text-align:center;font-family:var(--serif);font-size:13px;line-height:1.2}

/* ---------- glass bands at the top and bottom edge ---------- */
.glass{position:fixed;left:0;right:0;height:8vh;z-index:80;pointer-events:none;-webkit-backdrop-filter:blur(6px) saturate(1.15);backdrop-filter:blur(6px) saturate(1.15)}
.glass.top{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.glass.bottom{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}

/* ---------- "View" label that follows the cursor ---------- */
.view-label{position:fixed;left:0;top:0;z-index:120;pointer-events:none;font-size:13px;line-height:1.2;color:#fff;mix-blend-mode:difference;
  opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1)}
.view-label.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:none){.view-label{display:none}.tile{cursor:pointer}}

/* =========================================================
   Space — the first screen of the archive.
   Every image floats on a slowly turning sphere; drag / scroll to turn it,
   hover to read the title, click an image to open the grid at that work.
   ========================================================= */
body.mode-space{overflow:hidden}
body.mode-space .scroller{visibility:hidden}
.space{position:fixed;inset:0;z-index:70;background:#fff;overflow:hidden;touch-action:none;cursor:grab;
  transition:opacity .7s cubic-bezier(.65,0,.35,1),visibility 0s linear .7s}
.space.is-grabbing{cursor:grabbing}
body:not(.mode-space) .space{opacity:0;visibility:hidden;pointer-events:none}
body.mode-space .space{transition:opacity .7s cubic-bezier(.65,0,.35,1)}
.orb{position:absolute;left:50%;top:50%;width:0;height:0}
.plane{position:absolute;left:0;top:0;background:var(--skeleton);overflow:hidden;will-change:transform,opacity;cursor:none}
.plane img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
@media (hover:none){.plane{cursor:pointer}}
/* words left and right of the sphere */
.space-side{position:absolute;inset:50% 0 auto;transform:translateY(-50%);display:flex;justify-content:space-between;padding:0 9%;pointer-events:none;font-size:14px;line-height:1.4}
.space-side .serif{font-family:var(--serif);font-size:15px}
.space-side span{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.15em}
.space-side span>span{padding-bottom:0}
.space-side span>span{transform:translateY(105%);transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
.space.is-in .space-side span>span{transform:none}
.space-side span:nth-child(2)>span{transition-delay:.08s}
/* bottom: the hovered work's title, and a way into the full grid */
.space-foot{position:absolute;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.space-cap{height:36px;text-align:center;position:relative;width:100%}
.space-cap p{position:absolute;left:0;right:0;overflow:hidden}
.space-cap .t{top:0;font-size:12px;line-height:1.4}
.space-cap .s{top:17px;font-family:var(--serif);font-size:14px;line-height:1.3;color:var(--muted)}
.space-cap span{display:inline-block;transform:translateY(100%);opacity:0;transition:transform .75s cubic-bezier(.16,1,.3,1),opacity .5s ease}
.space-cap.show span{transform:none;opacity:1}
.space-cap .s span{transition-delay:.05s}
.space-hint{font-size:12px;line-height:1;color:var(--muted);transition:opacity .4s ease}
.space-cap.show + .space-hint{opacity:0}
.space-index{all:unset;pointer-events:auto;cursor:pointer;padding:6px 8px 4px;border-radius:4px;background:var(--chip);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);font-size:12px;line-height:1}
.space-index:hover{background:#e4e4e4}
.space-index:focus-visible{outline:2px solid #777;outline-offset:2px}
.to-space{all:unset;cursor:pointer;display:inline-block;margin-top:14px;font-family:var(--serif);font-size:14px;color:var(--muted);transition:color .2s ease}
.to-space:hover{color:var(--ink)}
.to-space:focus-visible{outline:2px solid #777;outline-offset:2px}
/* the work picked in the sphere briefly glows in the grid */
.tile.is-picked .tile-media::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--ink);animation:picked 2.4s ease forwards}
@keyframes picked{0%,60%{opacity:1}100%{opacity:0}}
@media (max-width:1024px){.space-side{display:none}}

@media (max-width:1024px){:root{--cols:2}}
@media (max-width:700px){
  :root{--pad:14px}
  .head{padding:140px var(--pad) 48px}
  .head-line{font-size:14px}.head-line .serif{font-size:15px}
}
@media (max-width:640px){:root{--cols:1;--row-gap:32px}}
@media (prefers-reduced-motion:reduce){.tile-media img{transition:none}}
</style>

</head>
<body>
<header class="site-top">
  <a class="site-name" href="index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="fashion.html">Fashion</a>
    <a href="portfolio_with_detail_pages/index.html">Object</a>
    <a href="graphic.html">Graphic</a>
    <a href="seohyeon_wi_projects_interactive_v2.html" class="is-active" aria-current="page">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="scroller" id="scroller">
  <main>
    <section class="head">
      <h1 class="head-line">Archive <span class="serif" id="headSub">— Fashion, Object &amp; Graphic</span></h1>
      <div class="filters" id="filters" role="tablist" aria-label="Filter work by category"></div>
      <button class="to-space" id="toSpace" type="button">← Back to the sphere</button>
    </section>
    <section class="grid" id="grid" aria-live="polite"></section>
    <footer class="foot">SEOHYEON WI™ — Archive</footer>
  </main>
</div>

<section class="space" id="space" aria-label="Archive — drag to turn, click an image to open it">
  <div class="orb" id="orb"></div>
  <div class="space-side" aria-hidden="true">
    <p><span><span>Seohyeon</span></span> <span><span>Wi</span></span></p>
    <p class="serif"><span><span>Fashion, Object</span></span> <span><span>&amp; Graphic</span></span></p>
  </div>
  <div class="space-foot">
    <div class="space-cap" id="spaceCap" aria-live="polite">
      <p class="t"><span id="capTitle"></span></p>
      <p class="s"><span id="capSub"></span></p>
    </div>
    <p class="space-hint">Drag to explore — click an image to open</p>
    <button class="space-index" id="spaceIndex" type="button">View all work</button>
  </div>
</section>

<div class="glass top" aria-hidden="true"></div>
<div class="glass bottom" aria-hidden="true"></div>
<div class="view-label" id="viewLabel" aria-hidden="true">View</div>
<div class="cursor" aria-hidden="true"></div>

<script src="fashion-data.js"></script>
<script src="works-data.js"></script>
<script>
(() => {
  const ORDER = ['all', 'fashion', 'object', 'graphic'];
  const NAMES = { all: 'All', ...WorksData.CATEGORY_NAMES };
  const filtersEl = document.getElementById('filters');
  const grid = document.getElementById('grid');
  const headSub = document.getElementById('headSub');
  const param = new URLSearchParams(location.search).get('category');
  let current = ORDER.includes(param) ? param : 'all';
  let works = [];

  /* ---------- filters ---------- */
  function renderFilters() {
    filtersEl.innerHTML = '';
    ORDER.forEach(key => {
      const count = key === 'all' ? works.length : works.filter(w => w.category === key).length;
      const b = document.createElement('button');
      b.className = 'filter' + (key === current ? ' is-active' : '');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(key === current));
      b.innerHTML = `${NAMES[key]}<sup>${count}</sup>`;
      b.addEventListener('click', () => setFilter(key));
      filtersEl.appendChild(b);
    });
  }

  function setHead() {
    const years = works.map(w => parseInt(w.year, 10)).filter(Boolean);
    const span = years.length ? `, ${Math.min(...years)}—${Math.max(...years)}` : '';
    headSub.textContent = current === 'all' ? `— Fashion, Object & Graphic${span}` : `— ${NAMES[current]}`;
  }

  /* ---------- grid ---------- */
  function revealImg(img) {
    const done = () => img.classList.add('is-loaded');
    if (img.complete && img.naturalWidth) done(); else img.addEventListener('load', done, { once: true });
  }
  function renderGrid() {
    const shown = current === 'all' ? works : works.filter(w => w.category === current);
    grid.innerHTML = '';
    if (!shown.length) { grid.innerHTML = '<p class="empty">No work here yet.</p>'; measure(); return; }
    shown.forEach(w => {
      const [first, second] = w.images;
      const t = document.createElement('a');
      t.className = 'tile';
      t.href = w.url;
      t.dataset.w = works.indexOf(w);
      t.setAttribute('aria-label', `${w.title} — ${w.categoryName}`);
      const info = [w.info, w.year].filter(Boolean).join(', ');
      t.innerHTML =
        `<div class="tile-media">` +
          (first ? `<img class="main${second ? ' has-alt' : ''}" src="${first.url}" alt="" loading="lazy">` : '') +
          (second ? `<img class="alt" src="${second.url}" alt="" loading="lazy">` : '') +
          `<div class="chips"><span class="chip">${w.categoryName}</span></div>` +
        `</div>` +
        `<p class="tile-title">${w.title}</p>` +
        `<p class="tile-cat">${info || w.categoryName}</p>`;
      grid.appendChild(t);
      t.querySelectorAll('img').forEach(revealImg);
    });
    measure();
  }

  function setFilter(key) {
    if (key === current) return;
    current = key;
    history.replaceState(null, '', gridUrl(key));
    document.title = `${key === 'all' ? 'Archive' : NAMES[key]} — SEOHYEON WI™`;
    renderFilters(); setHead(); renderGrid();
    window.scrollTo(0, 0); y = 0;
  }

  /* ---------- eased scrolling (wheel, touch and keys all use the real page scroll) ---------- */
  const scroller = document.getElementById('scroller');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) document.body.classList.add('native');
  let y = scrollY;
  function measure() { if (!reduce) document.body.style.height = scroller.offsetHeight + 'px'; }
  new ResizeObserver(measure).observe(scroller);
  (function frame() {
    if (!reduce) {
      y += (scrollY - y) * .12;
      if (Math.abs(scrollY - y) < .1) y = scrollY;
      scroller.style.transform = `translate3d(0,${-y.toFixed(2)}px,0)`;
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- hover: "View" label follows the cursor, second image fades in ---------- */
  const label = document.getElementById('viewLabel');
  let lx = innerWidth / 2, ly = innerHeight / 2, mx = lx, my = ly, hoverTile = null, hasMouse = false;
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    if (e.isTrusted) hasMouse = true;
    if (!hasMouse) return;
    mx = e.clientX; my = e.clientY;
    const t = document.elementFromPoint(mx, my)?.closest('.tile, .plane') || null;
    if (t !== hoverTile) {
      hoverTile?.classList.remove('is-hover');
      hoverTile = t;
      t?.classList.add('is-hover');
      label.classList.toggle('show', !!t);
      if (inSpace()) setCaption(t ? planes[+t.dataset.p].work : null);
    }
  });
  // after scrolling under a still mouse, re-check which tile is under it
  addEventListener('scroll', () => dispatchEvent(new PointerEvent('pointermove', { clientX: mx, clientY: my, pointerType: 'mouse' })), { passive: true });
  (function follow() {
    lx += (mx - lx) * .18; ly += (my - ly) * .18;
    label.style.left = lx + 'px'; label.style.top = ly + 'px';
    requestAnimationFrame(follow);
  })();

  /* =========================================================
     Space: the first screen — every image on a turning sphere.
     Click an image → the grid opens filtered to that work's category,
     scrolled to the work. "View all work" opens the whole grid.
     ========================================================= */
  const space = document.getElementById('space');
  const orb = document.getElementById('orb');
  const cap = document.getElementById('spaceCap');
  const capTitle = document.getElementById('capTitle');
  const capSub = document.getElementById('capSub');
  const PAGE = 'seohyeon_wi_projects_interactive_v2.html';
  const planes = [];
  const inSpace = () => document.body.classList.contains('mode-space');
  function gridUrl(key) { return `${PAGE}?view=grid${key === 'all' ? '' : `&category=${key}`}`; }

  let capWork = null;
  function setCaption(w) {
    if (w === capWork) return;
    capWork = w;
    cap.classList.remove('show');
    if (!w) return;
    void cap.offsetWidth;                 // restart the slide-up for each new work
    capTitle.textContent = w.title;
    capSub.textContent = [w.categoryName, w.info, w.year].filter(Boolean).join(', ');
    cap.classList.add('show');
  }

  function buildSphere() {
    // every work gives up to 3 images; repeat the set until the sphere is full enough
    const items = [];
    works.forEach(w => w.images.slice(0, 3).forEach(img => items.push({ work: w, img })));
    if (!items.length) return;
    const N = Math.min(90, Math.max(48, items.length));
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const it = items[i % items.length];
      const yy = 1 - (i + .5) / N * 2, rr = Math.sqrt(1 - yy * yy), th = golden * i;
      const el = document.createElement('div');
      el.className = 'plane';
      el.dataset.p = i;
      el.innerHTML = `<img src="${it.img.url}" alt="" draggable="false">`;
      orb.appendChild(el);
      planes.push({ el, work: it.work, ar: Math.min(1.5, Math.max(.62, it.img.ar || .8)),
        x: Math.cos(th) * rr, y: yy, z: Math.sin(th) * rr, delay: Math.random() * .5, hov: 0 });
    }
    sizePlanes();
  }

  let R = 300;
  function sizePlanes() {
    const small = innerWidth <= 640;
    R = Math.min(innerWidth, innerHeight) * (small ? .4 : .34);
    const base = R * (small ? .4 : .34);
    planes.forEach(p => {
      p.w = p.ar >= 1 ? base : base * p.ar;
      p.h = p.ar >= 1 ? base / p.ar : base;
      p.el.style.width = p.w + 'px'; p.el.style.height = p.h + 'px';
    });
  }
  addEventListener('resize', sizePlanes);

  /* turning: drag with momentum, the wheel spins it, and it drifts slowly on its own */
  let yaw = 0, pitch = .25, vYaw = 0, vPitch = 0, dragging = false, px = 0, py = 0, moved = 0;
  let introStart = performance.now(), exitStart = -1;
  space.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || exitStart >= 0) return;
    dragging = true; moved = 0; px = e.clientX; py = e.clientY; vYaw = vPitch = 0;
    space.setPointerCapture(e.pointerId);
    space.classList.add('is-grabbing');
  });
  space.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    vYaw = dx * .005; vPitch = dy * .005;
    yaw += vYaw; pitch = Math.max(-1.2, Math.min(1.2, pitch + vPitch));
  });
  const endDrag = e => {
    if (!dragging) return;
    dragging = false;
    space.classList.remove('is-grabbing');
    if (e.type === 'pointerup' && moved < 6) {
      const hit = document.elementFromPoint(e.clientX, e.clientY)?.closest('.plane');
      if (hit) pick(planes[+hit.dataset.p]);
    }
  };
  space.addEventListener('pointerup', endDrag);
  space.addEventListener('pointercancel', endDrag);
  space.addEventListener('wheel', e => {
    e.preventDefault();
    vYaw += Math.max(-60, Math.min(60, e.deltaY)) * .00035;
  }, { passive: false });

  const easeOut = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 4);
  (function spin(now) {
    requestAnimationFrame(spin);
    if (!inSpace() && exitStart < 0) return;
    if (!dragging) {
      yaw += vYaw + (reduce ? 0 : .0015);
      pitch = Math.max(-1.2, Math.min(1.2, pitch + vPitch));
      vYaw *= .94; vPitch *= .9;
    }
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const D = R * 2.6;
    const t = (now - introStart) / 1000;
    const ex = exitStart >= 0 ? easeOut((now - exitStart) / 700) : 0;
    planes.forEach(p => {
      const x1 = p.x * cy + p.z * sy, z1 = -p.x * sy + p.z * cy;
      const y2 = p.y * cp - z1 * sp, z2 = p.y * sp + z1 * cp;
      const k = reduce ? 1 : easeOut((t - p.delay) / 1.4);   // intro: planes bloom out from the centre
      const r = R * k * (1 + ex * 1.4);                        // exit: the sphere opens outward
      const persp = D / (D - z2 * r);
      p.hov += ((p.el === hoverTile ? 1 : 0) - p.hov) * .15;
      const s = persp * (.4 + .6 * k) * (1 + .08 * p.hov);
      const depth = (z2 + 1) / 2;
      p.el.style.transform = `translate3d(${(x1 * r * persp - p.w / 2).toFixed(1)}px,${(y2 * r * persp - p.h / 2).toFixed(1)}px,0) scale(${s.toFixed(3)})`;
      p.el.style.opacity = ((.2 + .8 * depth) * Math.min(1, k * 1.5) * (1 - ex)).toFixed(3);
      p.el.style.zIndex = Math.round(depth * 1000);
    });
  })(performance.now());

  /* switching between the sphere and the grid */
  function pick(p) {
    if (exitStart >= 0) return;
    exitStart = performance.now();
    setTimeout(() => { enterGrid(p.work); exitStart = -1; }, 380);
  }
  function enterGrid(work, push = true, key) {
    key = key || (work ? work.category : 'all');
    if (push) history.pushState(null, '', gridUrl(key));
    document.body.classList.remove('mode-space');
    setCaption(null); label.classList.remove('show'); hoverTile = null;
    current = key;
    document.title = `${key === 'all' ? 'Archive' : NAMES[key]} — SEOHYEON WI™`;
    renderFilters(); setHead(); renderGrid();
    window.scrollTo(0, 0); y = 0;
    if (!work) return;
    const tile = grid.querySelector(`.tile[data-w="${works.indexOf(work)}"]`);
    if (!tile) return;
    measure();
    const top = Math.max(0, tile.getBoundingClientRect().top - innerHeight * .2);
    window.scrollTo(0, top); y = top;
    tile.classList.add('is-picked');
  }
  function enterSpace(push = true) {
    if (push) history.pushState(null, '', PAGE);
    document.title = 'Archive — SEOHYEON WI™';
    label.classList.remove('show'); hoverTile = null;
    window.scrollTo(0, 0); y = 0;
    document.body.classList.add('mode-space');
    space.classList.remove('is-in'); void space.offsetWidth; space.classList.add('is-in');
    introStart = performance.now();
  }
  document.getElementById('spaceIndex').addEventListener('click', () => enterGrid(null));
  document.getElementById('toSpace').addEventListener('click', () => enterSpace());
  addEventListener('popstate', () => {
    const q = new URLSearchParams(location.search);
    if (q.get('view') === 'grid' || q.get('category')) enterGrid(null, false, ORDER.includes(q.get('category')) ? q.get('category') : 'all');
    else enterSpace(false);
  });

  /* ---------- boot ---------- */
  // a plain visit opens the sphere; ?view=grid or ?category=… opens the grid straight away
  const q0 = new URLSearchParams(location.search);
  const startInGrid = q0.get('view') === 'grid' || !!param;
  if (!startInGrid) document.body.classList.add('mode-space');
  document.title = `${current === 'all' ? 'Archive' : NAMES[current]} — SEOHYEON WI™`;
  WorksData.loadAll().then(list => {
    works = list;
    renderFilters(); setHead(); renderGrid();
    buildSphere();
    if (!startInGrid) { introStart = performance.now(); space.classList.add('is-in'); }
  });
})();
</script>
<script src="site-clock.js"></script>
<script src="site-cursor.js"></script>
</body>
</html>
