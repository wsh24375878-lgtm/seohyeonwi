<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archive — SEOHYEON WI™</title>
<style>
/* =========================================================
   Archive — an index of every work.
   A quiet typographic list (no. / title / category / type / year) in the site's own
   Arial + grey. Computer: hovering a row shows the work's images floating by the cursor,
   one after another, while the other rows step back. Phone: tap a row to open it and
   swipe through its images. Filter by category, sort by year or name.
   (Earlier versions are in the git history.)
   ========================================================= */
:root{ --ink:#050505; --muted:#8c8c8c; --line:#e7e7e7; --pad:24px; }
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
p,h1{margin:0;font-weight:400}

/* ---------- head ---------- */
.head{padding:150px var(--pad) 56px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}
.title{font-size:clamp(26px,3.25vw,56px);line-height:1.05;letter-spacing:-.04em}
.title sup{font-size:.32em;letter-spacing:0;color:var(--muted);vertical-align:top;margin-left:.25em;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-size:15px;line-height:1}
.filters,.sorts{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.filters button,.sorts button{color:var(--muted);transition:color .2s ease}
.filters button:hover,.sorts button:hover,.filters button.on,.sorts button.on{color:var(--ink)}
.filters button.on,.sorts button.on{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.filters sup{font-size:9px;margin-left:2px;font-variant-numeric:tabular-nums}
.sorts{font-size:13px}

/* ---------- index ---------- */
.index{padding:0 var(--pad) 160px}
.cols,.row-main{display:grid;grid-template-columns:56px minmax(0,2.2fr) minmax(0,.9fr) minmax(0,1.6fr) 64px;column-gap:16px;align-items:baseline}
.cols{padding:0 0 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--ink)}
.cols span:last-child,.row-main .y{text-align:right}
.row{border-bottom:1px solid var(--line);opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1)}
.row.in{opacity:1;transform:none}
.row-main{padding:15px 0 14px;font-size:15px;line-height:1.25;transition:opacity .25s ease,color .25s ease}
.row-main .n,.row-main .c,.row-main .t,.row-main .y{color:var(--muted);font-variant-numeric:tabular-nums}
.row-main .ti{position:relative;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.row-main .ti small{font-size:12px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
/* hover: the row steps forward, the rest step back */
@media (hover:hover){
  .index.hovering .row-main{opacity:.28}
  .index.hovering .row.is-hover .row-main{opacity:1}
  .row.is-hover .row-main .ti{transform:translateX(10px)}
  .row.is-hover .row-main .n,.row.is-hover .row-main .c,.row.is-hover .row-main .t,.row.is-hover .row-main .y{color:var(--ink)}
}
.empty{padding:40px 0;color:var(--muted);font-size:15px}

/* ---------- floating preview (computer) ---------- */
.preview{position:fixed;left:0;top:0;z-index:90;pointer-events:none;width:clamp(220px,20vw,320px);
  opacity:0;transform:translate(-50%,-50%) scale(.92);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1)}
.preview.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.preview .frame{position:relative;width:100%;aspect-ratio:4/5;background:#f1f1f1;overflow:hidden}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
.preview img.on{opacity:1}
.preview .cap{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (hover:none){.preview{display:none}}

/* ---------- opened row (phone) ---------- */
.row-open{display:none}
.row.open .row-open{display:block;padding:0 0 18px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:none;height:150px;width:auto;display:block;background:#f1f1f1}
.go{display:inline-block;margin-top:12px;font-size:13px}

@media (max-width:900px){
  .cols,.row-main{grid-template-columns:40px minmax(0,1fr) minmax(0,.8fr) 52px}
  .cols .tcol,.row-main .t{display:none}
}
@media (max-width:700px){
  :root{--pad:14px}
  .head{padding:120px var(--pad) 36px;grid-template-columns:1fr}
  .controls{align-items:flex-start;font-size:13px}
  .filters,.sorts{justify-content:flex-start;gap:12px}
  .sorts{font-size:12px}
  .cols,.row-main{grid-template-columns:30px minmax(0,1fr) 44px;column-gap:10px}
  .cols .ccol,.row-main .c{display:none}
  .row-main{font-size:14px;padding:14px 0 13px}
  .row.open .row-main .ti,.row.open .row-main .n,.row.open .row-main .y{color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){.row{transition:none;opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="site-cursor.css">
</head>
<body>
<header class="site-top">
  <a class="site-name" href="index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="fashion.html">Fashion</a>
    <a href="portfolio_with_detail_pages/index.html">3D</a>
    <a href="portfolio_with_detail_pages/index.html?cat=product">Product</a>
    <a href="graphic.html">Graphic</a>
    <a href="seohyeon_wi_projects_interactive_v2.html" class="is-active" aria-current="page">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section class="head">
    <h1 class="title">Archive<sup id="total"></sup></h1>
    <div class="controls">
      <div class="filters" id="filters" role="tablist" aria-label="Category"></div>
      <div class="sorts" id="sorts" aria-label="Sort"></div>
    </div>
  </section>
  <section class="index" id="index" aria-live="polite">
    <div class="cols" aria-hidden="true"><span>No.</span><span>Title</span><span class="ccol">Category</span><span class="tcol">Type</span><span>Year</span></div>
    <div id="rows"></div>
  </section>
</main>

<div class="preview" id="preview" aria-hidden="true"><div class="frame" id="frame"></div><div class="cap"><span id="capT"></span><span id="capN"></span></div></div>
<div class="cursor" aria-hidden="true"></div>

<script src="fashion-data.js"></script>
<script src="works-data.js"></script>
<script>
(() => {
  const ORDER = ['all', 'fashion', 'object', 'product', 'graphic'];
  const NAMES = { all: 'All', ...WorksData.CATEGORY_NAMES };
  const SORTS = [['new', 'Newest'], ['old', 'Oldest'], ['az', 'A–Z']];
  const q = new URLSearchParams(location.search);
  let cat = ORDER.includes(q.get('category')) ? q.get('category') : 'all';
  let sort = 'new';
  let works = [];
  const rowsEl = document.getElementById('rows'), indexEl = document.getElementById('index');
  const pad = n => String(n).padStart(2, '0');
  const thumb = src => WorksData.thumbOf(src) || src;

  /* ---------- controls ---------- */
  function renderControls() {
    const f = document.getElementById('filters'); f.innerHTML = '';
    ORDER.forEach(k => {
      const n = k === 'all' ? works.length : works.filter(w => w.category === k).length;
      if (!n && k !== 'all') return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = k === cat ? 'on' : ''; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(k === cat));
      b.innerHTML = `${NAMES[k]}<sup>${n}</sup>`;
      b.addEventListener('click', () => { if (k === cat) return; cat = k; history.replaceState(null, '', k === 'all' ? location.pathname : `?category=${k}`); renderControls(); renderRows(); });
      f.appendChild(b);
    });
    const s = document.getElementById('sorts'); s.innerHTML = '';
    SORTS.forEach(([k, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = k === sort ? 'on' : ''; b.textContent = label;
      b.addEventListener('click', () => { if (k === sort) return; sort = k; renderControls(); renderRows(); });
      s.appendChild(b);
    });
  }

  /* ---------- rows ---------- */
  const yearOf = w => parseInt(w.year, 10) || 0;
  function renderRows() {
    let list = works.filter(w => cat === 'all' || w.category === cat);
    list = list.slice().sort((a, b) =>
      sort === 'az' ? a.title.localeCompare(b.title) :
      sort === 'old' ? (yearOf(a) || 9999) - (yearOf(b) || 9999) || a.i - b.i :
      yearOf(b) - yearOf(a) || a.i - b.i);
    document.getElementById('total').textContent = pad(list.length);
    rowsEl.innerHTML = '';
    if (!list.length) { rowsEl.innerHTML = '<p class="empty">No work here yet.</p>'; return; }
    list.forEach((w, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        `<a class="row-main" href="${w.url}">` +
          `<span class="n">${pad(i + 1)}</span>` +
          `<span class="ti">${w.title}${w.all.length > 1 ? `<small>${pad(w.all.length)}</small>` : ''}</span>` +
          `<span class="c">${w.categoryName}</span>` +
          `<span class="t">${w.info || ''}</span>` +
          `<span class="y">${w.year || '—'}</span>` +
        `</a>` +
        `<div class="row-open"><div class="strip"></div><a class="go" href="${w.url}">View project →</a></div>`;
      row._w = w;
      rowsEl.appendChild(row);
      // rows rise in one after another
      setTimeout(() => row.classList.add('in'), 40 + Math.min(i, 24) * 35);
    });
  }

  /* ---------- computer: hover a row → its images float by the cursor, one after another ---------- */
  const preview = document.getElementById('preview'), frame = document.getElementById('frame');
  const capT = document.getElementById('capT'), capN = document.getElementById('capN');
  let hoverRow = null, imgs = [], cur = 0, cycle = 0;
  let mx = innerWidth / 2, my = innerHeight / 2, px = mx, py = my;
  function showPreview(row) {
    clearInterval(cycle);
    hoverRow?.classList.remove('is-hover');
    hoverRow = row;
    indexEl.classList.toggle('hovering', !!row);
    if (!row) { preview.classList.remove('show'); return; }
    row.classList.add('is-hover');
    const w = row._w, srcs = w.all.slice(0, 12);
    frame.innerHTML = ''; imgs = srcs.map(src => { const im = new Image(); im.src = thumb(src); im.alt = ''; frame.appendChild(im); return im; });
    cur = 0; imgs[0] && imgs[0].classList.add('on');
    capT.textContent = w.categoryName; capN.textContent = srcs.length > 1 ? `1 / ${srcs.length}` : '';
    preview.classList.add('show');
    if (imgs.length > 1) cycle = setInterval(() => {
      imgs[cur].classList.remove('on'); cur = (cur + 1) % imgs.length; imgs[cur].classList.add('on');
      capN.textContent = `${cur + 1} / ${imgs.length}`;
    }, 650);
  }
  if (matchMedia('(hover: hover)').matches) {
    addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;
      mx = e.clientX; my = e.clientY;
      const row = document.elementFromPoint(mx, my)?.closest('.row') || null;
      if (row !== hoverRow) showPreview(row);
    });
    document.addEventListener('mouseleave', () => showPreview(null));
    addEventListener('scroll', () => { const row = document.elementFromPoint(mx, my)?.closest('.row') || null; if (row !== hoverRow) showPreview(row); }, { passive: true });
    (function follow() {
      // the image trails the cursor a little, and sits beside it so it never covers the row's text
      const w = preview.offsetWidth, side = mx + 40 + w > innerWidth ? -1 : 1;
      const tx = mx + side * (w / 2 + 40), ty = Math.max(w * .65, Math.min(innerHeight - w * .65, my));
      px += (tx - px) * .16; py += (ty - py) * .16;
      preview.style.left = px + 'px'; preview.style.top = py + 'px';
      requestAnimationFrame(follow);
    })();
  }

  /* ---------- phone: tap a row to open it (its images side by side), tap again to close ---------- */
  rowsEl.addEventListener('click', e => {
    if (matchMedia('(hover: hover)').matches) return;          // computer: the row links straight to the work
    const main = e.target.closest('.row-main'); if (!main) return;
    e.preventDefault();
    const row = main.parentElement, opening = !row.classList.contains('open');
    rowsEl.querySelectorAll('.row.open').forEach(r => r.classList.remove('open'));
    if (!opening) return;
    const strip = row.querySelector('.strip');
    if (!strip.childElementCount) strip.innerHTML = row._w.all.map(src => `<img src="${thumb(src)}" alt="" loading="lazy">`).join('');
    row.classList.add('open');
  });

  /* ---------- go ---------- */
  WorksData.loadAll().then(list => {
    works = list.filter(w => (w.all || []).length).map((w, i) => Object.assign(w, { i }));
    renderControls(); renderRows();
  });
})();
</script>
<script src="site-clock.js"></script>
<script src="site-cursor.js"></script>
</body>
