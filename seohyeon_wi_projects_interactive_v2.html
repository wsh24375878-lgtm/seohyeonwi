<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archive — SEOHYEON WI™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Archive — image grid
   Centred heading, 3:4 tiles in 3 / 2 / 1 columns, small title + serif
   category under each tile, "View" label following the cursor,
   eased scrolling and soft glass bands at the top and bottom edge.
   (The previous design is saved as ../_archive-original-design-20261120.html)
   ========================================================= */
:root{
  --ink:#0a0a0a; --muted:#8c8c8c; --skeleton:#ededed;
  --chip:rgba(237,237,237,.5);
  --pad:8px; --col-gap:8px; --row-gap:40px; --cols:3;
  --serif:'Instrument Serif','Times New Roman',serif;
  --sans:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p,h1,h2{margin:0;font-weight:400}

/* eased scrolling: the page keeps its real height, the content is drawn fixed and glides to the scroll position */
.scroller{position:fixed;top:0;left:0;width:100%;will-change:transform}
body.native .scroller{position:static;transform:none!important}

/* ---------- heading ---------- */
.head{padding:200px var(--pad) 80px;text-align:center}
.head-line{font-size:16px;line-height:1.2;letter-spacing:-.01em}
.head-line .serif{font-family:var(--serif);font-size:17px}
.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin-top:22px}
.filter{all:unset;cursor:pointer;padding:6px 8px 4px;border-radius:4px;background:var(--chip);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);font-size:12px;line-height:1;color:var(--muted);transition:color .2s ease,background-color .2s ease}
.filter:hover{color:var(--ink)}
.filter.is-active{color:var(--ink);background:#e4e4e4}
.filter sup{font-size:9px;margin-left:2px;font-variant-numeric:tabular-nums}
.filter:focus-visible{outline:2px solid #777;outline-offset:2px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);column-gap:var(--col-gap);row-gap:var(--row-gap);padding:0 var(--pad)}
.tile{display:block;cursor:none}
.tile-media{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--skeleton)}
.tile-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;
  opacity:0;filter:blur(18px);transform:scale(1.04);transition:opacity .6s ease,filter .6s ease,transform .9s cubic-bezier(.16,1,.3,1)}
.tile-media img.is-loaded{opacity:1;filter:blur(0);transform:none}
/* hover: a second image (when there is one) fades in through a blur */
.tile-media img.alt{opacity:0;filter:blur(18px)}
.tile.is-hover .tile-media img.alt.is-loaded{opacity:1;filter:blur(0)}
.tile.is-hover .tile-media img.main.has-alt{filter:blur(10px)}
.chips{position:absolute;top:8px;left:8px;z-index:2;display:flex;gap:2px}
.chip{padding:6px 8px 4px;border-radius:4px;background:var(--chip);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);font-size:12px;line-height:1}
.tile-title{margin-top:12px;font-size:12px;line-height:1.2}
.tile-cat{margin-top:6px;padding-bottom:6px;font-family:var(--serif);font-size:13px;line-height:1.2;color:var(--muted)}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- footer ---------- */
.foot{padding:240px var(--pad) 20px;text-align:center;font-family:var(--serif);font-size:13px;line-height:1.2}

/* ---------- glass bands at the top and bottom edge ---------- */
.glass{position:fixed;left:0;right:0;height:8vh;z-index:80;pointer-events:none;-webkit-backdrop-filter:blur(6px) saturate(1.15);backdrop-filter:blur(6px) saturate(1.15)}
.glass.top{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.glass.bottom{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}

/* ---------- "View" label that follows the cursor ---------- */
.view-label{position:fixed;left:0;top:0;z-index:120;pointer-events:none;font-size:13px;line-height:1.2;color:#fff;mix-blend-mode:difference;
  opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1)}
.view-label.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:none){.view-label{display:none}.tile{cursor:pointer}}

@media (max-width:1024px){:root{--cols:2}}
@media (max-width:700px){
  :root{--pad:14px}
  .head{padding:140px var(--pad) 48px}
  .head-line{font-size:14px}.head-line .serif{font-size:15px}
}
@media (max-width:640px){:root{--cols:1;--row-gap:32px}}
@media (prefers-reduced-motion:reduce){.tile-media img{transition:none}}
</style>
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="site-cursor.css">
</head>
<body>
<header class="site-top">
  <a class="site-name" href="index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="fashion.html">Fashion</a>
    <a href="portfolio_with_detail_pages/index.html">Object</a>
    <a href="graphic.html">Graphic</a>
    <a href="seohyeon_wi_projects_interactive_v2.html" class="is-active" aria-current="page">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="scroller" id="scroller">
  <main>
    <section class="head">
      <h1 class="head-line">Archive <span class="serif" id="headSub">— Fashion, Object &amp; Graphic</span></h1>
      <div class="filters" id="filters" role="tablist" aria-label="Filter work by category"></div>
    </section>
    <section class="grid" id="grid" aria-live="polite"></section>
    <footer class="foot">SEOHYEON WI™ — Archive</footer>
  </main>
</div>

<div class="glass top" aria-hidden="true"></div>
<div class="glass bottom" aria-hidden="true"></div>
<div class="view-label" id="viewLabel" aria-hidden="true">View</div>
<div class="cursor" aria-hidden="true"></div>

<script src="fashion-data.js"></script>
<script src="works-data.js"></script>
<script>
(() => {
  const ORDER = ['all', 'fashion', 'object', 'graphic'];
  const NAMES = { all: 'All', ...WorksData.CATEGORY_NAMES };
  const filtersEl = document.getElementById('filters');
  const grid = document.getElementById('grid');
  const headSub = document.getElementById('headSub');
  const param = new URLSearchParams(location.search).get('category');
  let current = ORDER.includes(param) ? param : 'all';
  let works = [];

  /* ---------- filters ---------- */
  function renderFilters() {
    filtersEl.innerHTML = '';
    ORDER.forEach(key => {
      const count = key === 'all' ? works.length : works.filter(w => w.category === key).length;
      const b = document.createElement('button');
      b.className = 'filter' + (key === current ? ' is-active' : '');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(key === current));
      b.innerHTML = `${NAMES[key]}<sup>${count}</sup>`;
      b.addEventListener('click', () => setFilter(key));
      filtersEl.appendChild(b);
    });
  }

  function setHead() {
    const years = works.map(w => parseInt(w.year, 10)).filter(Boolean);
    const span = years.length ? `, ${Math.min(...years)}—${Math.max(...years)}` : '';
    headSub.textContent = current === 'all' ? `— Fashion, Object & Graphic${span}` : `— ${NAMES[current]}`;
  }

  /* ---------- grid ---------- */
  function revealImg(img) {
    const done = () => img.classList.add('is-loaded');
    if (img.complete && img.naturalWidth) done(); else img.addEventListener('load', done, { once: true });
  }
  function renderGrid() {
    const shown = current === 'all' ? works : works.filter(w => w.category === current);
    grid.innerHTML = '';
    if (!shown.length) { grid.innerHTML = '<p class="empty">No work here yet.</p>'; measure(); return; }
    shown.forEach(w => {
      const [first, second] = w.images;
      const t = document.createElement('a');
      t.className = 'tile';
      t.href = w.url;
      t.setAttribute('aria-label', `${w.title} — ${w.categoryName}`);
      const info = [w.info, w.year].filter(Boolean).join(', ');
      t.innerHTML =
        `<div class="tile-media">` +
          (first ? `<img class="main${second ? ' has-alt' : ''}" src="${first.url}" alt="" loading="lazy">` : '') +
          (second ? `<img class="alt" src="${second.url}" alt="" loading="lazy">` : '') +
          `<div class="chips"><span class="chip">${w.categoryName}</span></div>` +
        `</div>` +
        `<p class="tile-title">${w.title}</p>` +
        `<p class="tile-cat">${info || w.categoryName}</p>`;
      grid.appendChild(t);
      t.querySelectorAll('img').forEach(revealImg);
    });
    measure();
  }

  function setFilter(key) {
    if (key === current) return;
    current = key;
    history.replaceState(null, '', key === 'all' ? 'seohyeon_wi_projects_interactive_v2.html' : `seohyeon_wi_projects_interactive_v2.html?category=${key}`);
    document.title = `${key === 'all' ? 'Archive' : NAMES[key]} — SEOHYEON WI™`;
    renderFilters(); setHead(); renderGrid();
    window.scrollTo(0, 0); y = 0;
  }

  /* ---------- eased scrolling (wheel, touch and keys all use the real page scroll) ---------- */
  const scroller = document.getElementById('scroller');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) document.body.classList.add('native');
  let y = scrollY;
  function measure() { if (!reduce) document.body.style.height = scroller.offsetHeight + 'px'; }
  new ResizeObserver(measure).observe(scroller);
  (function frame() {
    if (!reduce) {
      y += (scrollY - y) * .12;
      if (Math.abs(scrollY - y) < .1) y = scrollY;
      scroller.style.transform = `translate3d(0,${-y.toFixed(2)}px,0)`;
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- hover: "View" label follows the cursor, second image fades in ---------- */
  const label = document.getElementById('viewLabel');
  let lx = innerWidth / 2, ly = innerHeight / 2, mx = lx, my = ly, hoverTile = null, hasMouse = false;
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    if (e.isTrusted) hasMouse = true;
    if (!hasMouse) return;
    mx = e.clientX; my = e.clientY;
    const t = document.elementFromPoint(mx, my)?.closest('.tile') || null;
    if (t !== hoverTile) {
      hoverTile?.classList.remove('is-hover');
      hoverTile = t;
      t?.classList.add('is-hover');
      label.classList.toggle('show', !!t);
    }
  });
  // after scrolling under a still mouse, re-check which tile is under it
  addEventListener('scroll', () => dispatchEvent(new PointerEvent('pointermove', { clientX: mx, clientY: my, pointerType: 'mouse' })), { passive: true });
  (function follow() {
    lx += (mx - lx) * .18; ly += (my - ly) * .18;
    label.style.left = lx + 'px'; label.style.top = ly + 'px';
    requestAnimationFrame(follow);
  })();

  /* ---------- boot ---------- */
  document.title = `${current === 'all' ? 'Archive' : NAMES[current]} — SEOHYEON WI™`;
  WorksData.loadAll().then(list => {
    works = list;
    renderFilters(); setHead(); renderGrid();
  });
})();
</script>
<script src="site-clock.js"></script>
<script src="site-cursor.js"></script>
</body>
</html>
