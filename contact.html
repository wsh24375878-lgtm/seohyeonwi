<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — SEOHYEON WI™</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#050505;font-family:Arial,Helvetica,sans-serif;font-weight:400}
body{overflow:hidden}
a{color:inherit;text-decoration:none}
p,h1,h2{margin:0}

.page{position:relative;height:100vh;height:100dvh;padding:54px 24px 24px;display:flex;flex-direction:column;justify-content:space-between}
.intro{width:min(65vw,1080px)}

/* contact lines sit at the bottom, like the main page menu */
.list{border-top:1px solid #050505}
.item{display:grid;grid-template-columns:minmax(140px,1fr) 4fr auto;align-items:baseline;gap:24px;padding:18px 0 20px;border-bottom:1px solid #e7e7e7}
.value{font-size:clamp(26px,3.25vw,56px);line-height:1.05;letter-spacing:-.04em;background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer;justify-self:start}
.value:hover{text-decoration:underline;text-underline-offset:.12em;text-decoration-thickness:1px}
.state{min-width:90px;text-align:right}
.note{margin-top:14px}

@media (max-width:700px){
  body{overflow:auto}
  .page{padding:64px 14px 18px;height:auto;min-height:100vh;min-height:100dvh;gap:56px}
  .intro{width:100%}
  .item{grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0 16px}
  .item .label{grid-column:1/-1}
  .value{font-size:clamp(20px,6.4vw,34px)}
}
</style>
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="site-cursor.css">
</head>
<body>
<header class="site-top">
  <a class="site-name" href="index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="fashion.html">Fashion</a>
    <a href="portfolio_with_detail_pages/index.html">Object</a>
    <a href="graphic.html">Graphic</a>
    <a href="seohyeon_wi_projects_interactive_v2.html">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="about.html">About</a>
    <a href="contact.html" class="is-active" aria-current="page">Contact</a>
  </nav>
</header>

<main class="page">
  <h1 class="big-text ko intro">프로젝트와 협업에 대한 이야기를 나눠요.<br><span class="muted" lang="en">say hello, share an idea, or start something together.</span></h1>

  <section aria-label="Contact information">
    <div class="list">
      <!-- 실제 정보로 바꿔주세요: data-copy 값과 버튼 글자를 함께 수정 -->
      <div class="item">
        <span class="label ui-text muted">Email</span>
        <button class="value" type="button" data-copy="hello@example.com">hello@example.com</button>
        <span class="state ui-text muted" aria-live="polite">Click to copy</span>
      </div>
      <div class="item">
        <span class="label ui-text muted">Instagram</span>
        <button class="value" type="button" data-copy="@your_instagram">@your_instagram</button>
        <span class="state ui-text muted" aria-live="polite">Click to copy</span>
      </div>
    </div>
    <p class="note ui-text muted">임시 예시 연락처입니다 — 실제 이메일과 인스타그램으로 바꿔주세요.</p>
  </section>
</main>
<div class="cursor" aria-hidden="true"></div>
<script>
document.querySelectorAll('.value[data-copy]').forEach(button => {
  const state = button.parentElement.querySelector('.state');
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(button.dataset.copy);
      state.textContent = 'Copied';
    } catch (e) {
      state.textContent = button.dataset.copy;
    }
    clearTimeout(button.timer);
    button.timer = setTimeout(() => { state.textContent = 'Click to copy'; }, 1600);
  });
});
</script>
<script src="site-clock.js"></script>
<script src="site-cursor.js"></script>
</body>
</html>
