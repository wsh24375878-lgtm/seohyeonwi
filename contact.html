<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT — SEOHYEON WI™</title>
<style>
:root{--ink:#080808;--muted:#888;--line:#e7e7e7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;padding:34px}
.back-button{position:absolute;top:34px;left:34px;width:43px;height:43px;border-radius:50%;background:#090909;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:300;line-height:1;transition:transform .3s ease}
.back-button:hover{transform:scale(1.07)}
.navigation{position:absolute;top:32px;right:35px;text-align:right;font-size:13px;line-height:24px}
.navigation a{display:block;color:var(--muted)}
.navigation a:hover,.navigation .active{color:var(--ink)}
.content{max-width:1120px;margin:180px auto 0}
.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.04em}
h1{font-size:clamp(60px,13vw,160px);font-weight:400;letter-spacing:-.08em;line-height:.85;margin:18px 0 35px}
.intro{max-width:600px;font-size:clamp(18px,2.3vw,26px);line-height:1.5;letter-spacing:-.03em;margin:0 0 80px}
.contact-list{border-top:1px solid var(--ink)}
.contact-item{display:grid;grid-template-columns:180px 1fr auto;align-items:baseline;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.label{font-size:11px;color:var(--muted)}
.value{font-size:clamp(20px,3vw,34px);letter-spacing:-.04em}
.note{font-size:10px;color:var(--muted);text-align:right}
.footer{max-width:1120px;margin:90px auto 0;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
@media(max-width:650px){
 .page{padding:22px 18px 42px}
 .back-button{top:22px;left:18px;width:40px;height:40px}
 .navigation{top:20px;right:18px;font-size:11px;line-height:21px}
 .content{margin-top:145px}
 .intro{margin-bottom:55px}
 .contact-item{grid-template-columns:1fr;gap:8px;padding:19px 0}
 .note{text-align:left}
 .footer{margin-top:60px}
}
</style>
<link rel="stylesheet" href="site-cursor.css">
</head>
<body>
<main class="page">
<a class="back-button" href="index.html" aria-label="메인으로 돌아가기">‹</a>
<nav class="navigation" aria-label="주요 메뉴">
  <a href="index.html">HOME</a>
  <a href="seohyeon_wi_projects_interactive_v2.html">PROJECTS</a>
  <a href="about.html">ABOUT ME</a>
  <a href="contact.html" class="active" aria-current="page">CONTACT</a>
</nav>
<div class="content">
  <div class="eyebrow">LET'S CONNECT</div>
  <h1>CONTACT</h1>
  <p class="intro">프로젝트와 협업에 대한 이야기를 나눠요.<br>연락처는 실제 정보로 교체할 수 있도록 임시 예시로 표시했습니다.</p>
  <section class="contact-list" aria-label="Contact information">
    <div class="contact-item">
      <span class="label">EMAIL</span>
      <span class="value">hello@example.com</span>
      <span class="note">임시 예시 · 실제 주소 아님</span>
    </div>
    <div class="contact-item">
      <span class="label">INSTAGRAM</span>
      <span class="value">@your_instagram</span>
      <span class="note">임시 예시 · 실제 계정 아님</span>
    </div>
  </section>
  <footer class="footer"><span>SEOHYEON WI™</span><a href="index.html">BACK TO HOME ↗</a></footer>
</div>
</main>
<script src="site-cursor.js"></script>
</body>
</html>
