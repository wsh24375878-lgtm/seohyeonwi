<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#050505;font-family:Arial,Helvetica,sans-serif;font-weight:400}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
p,h1{margin:0}

.top-fade{position:fixed;top:0;left:0;right:0;height:46px;background:#fff;z-index:99}
.page{padding:54px 24px 24px}

.head{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:end}
.head .desc{max-width:420px;margin-top:14px}
.head .meta{text-align:right}

.hero{position:relative;margin-top:56px;height:min(76vh,760px);min-height:360px;background:#ebebeb;overflow:hidden}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.shot{position:relative;aspect-ratio:4/5;background:#f0f0f0;overflow:hidden}
.shot:nth-child(2),.shot:nth-child(3){background:#e6e6e6}
.hero img,.shot img{display:block;width:100%;height:100%;object-fit:cover}
.label{position:absolute;left:16px;bottom:14px}

.pager{display:flex;justify-content:space-between;margin-top:96px;padding-top:14px;border-top:1px solid #050505}
/* real images: show the whole page spread, no cropping */
.hero.has-image{height:auto;min-height:0;background:none}
.hero.has-image img{height:auto;object-fit:contain}
.gallery:has(.has-image){grid-template-columns:1fr}
.shot.has-image{aspect-ratio:auto;background:none}
.shot.has-image img{height:auto}
.gallery.is-empty{display:none}

@media (max-width:700px){
  .top-fade{height:62px}
  .page{padding:64px 14px 18px}
  .head{grid-template-columns:1fr}
  .head .meta{text-align:left}
  .hero{margin-top:32px;height:62vh;min-height:300px}
  .gallery{grid-template-columns:1fr;gap:14px;margin-top:14px}
  .pager{margin-top:56px}
}
</style>
