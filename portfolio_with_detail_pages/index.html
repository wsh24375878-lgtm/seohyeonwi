<!-- ======================= 3D object ======================= -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const TILT_Y = THREE.MathUtils.degToRad(42), TILT_X = THREE.MathUtils.degToRad(28);
const FOLLOW = .12, ENV_SPIN = .15, BOB_AMP = .07, BOB_FREQ = .9, INTRO = .8, INTRO_TILT = .5;

const host = document.getElementById('app');
const veil = document.getElementById('veil');
let visible = true;
if ('IntersectionObserver' in window) new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(host);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, .1, 100);
camera.position.set(0, 0, 12.6);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);
function resize() {
  const w = host.clientWidth || innerWidth, h = host.clientHeight || innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();

/* soft grey studio environment for the chrome reflections */
function studio(w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  let seed = 20000;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  g.fillStyle = '#5c5c5c'; g.fillRect(0, 0, w, h);
  const blob = (x, y, r, v, a) => {
    for (const off of [-w, 0, w]) {
      const gr = g.createRadialGradient(x + off, y, 0, x + off, y, r);
      gr.addColorStop(0, `rgba(${v},${v},${v},${a})`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
      g.fillStyle = gr; g.fillRect(x + off - r, y - r, r * 2, r * 2);
    }
  };
  for (let i = 0; i < 24; i++) blob(rnd() * w, rnd() * h, (.16 + rnd() * .32) * w, Math.round(255 * Math.pow(rnd(), 1.1)), .5 + rnd() * .3);
  for (let i = 0; i < 4; i++) blob(rnd() * w, (.36 + rnd() * .28) * h, (.15 + rnd() * .12) * w, 34 + Math.floor(rnd() * 22), .5);
  for (let i = 0; i < 4; i++) blob(rnd() * w, (rnd() < .5 ? .02 + rnd() * .22 : .76 + rnd() * .22) * h, (.1 + rnd() * .1) * w, 0, 1);
  for (let i = 0; i < 4; i++) blob(rnd() * w, rnd() * h, (.11 + rnd() * .08) * w, 255, .7);
  for (let i = 0; i < 18; i++) blob(rnd() * w, rnd() * h, (.03 + rnd() * .08) * w, 255, .95);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = studio();
scene.environment = pmrem.fromEquirectangular(envTex).texture;
envTex.dispose(); pmrem.dispose();

/* chrome material with a click "water drop": the spot where you click dips in and springs back,
   then a few wide rings spread out from it and fade — like one drop falling into still water */
const material = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0, envMapIntensity: 1.2 });
const DROPS = 6;                                                   // drops that can ripple at the same time
const dropC = Array.from({ length: DROPS }, () => new THREE.Vector3());
const dropT = new Array(DROPS).fill(-1);                           // seconds since each drop fell (-1 = idle)
let nextDrop = 0;
material.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, {
    // up to DROPS drops at once, so a new click starts a new drop even while the last one is still moving
    uRipCenter: { value: dropC }, uRipTime: { value: dropT },
    uRipSpeed: { value: 2.2 },      // how fast the ring travels out
    uRipWavelength: { value: .32 },   // width of the ring
    uRipWidth: { value: .16 },        // length of the ring train (small = a single ring)
    uRipAmp: { value: .028 },         // ring height (small = one little drop)
    uRipNormal: { value: 1.2 },       // how strongly the ring bends the reflection
    uRipDecay: { value: 5.6 },        // how fast everything calms down (gone in about 0.7 s)
  });
  material.userData.shader = shader;
  shader.vertexShader = `
    #define DROPS ${DROPS}
    uniform vec3 uRipCenter[DROPS];
    uniform float uRipTime[DROPS];
    uniform float uRipSpeed, uRipWavelength, uRipWidth, uRipAmp, uRipNormal, uRipDecay;
    float dropWave(float d, float t) {
      // the drop's impact: a small dip at the spot that bounces back up and settles
      float crater = -1.2 * exp(-pow(d / .11, 2.0)) * cos(t * 20.0) * exp(-t * 8.0);
      // rings: a short train of crests riding just behind the travelling front, lower as they spread
      float x = d - t * uRipSpeed;
      float rings = sin(x * 6.2831853 / uRipWavelength) * exp(-pow(x / uRipWidth, 2.0))
                  * smoothstep(0.0, .08, t) / (1.0 + d * 2.0);
      return (crater + rings) * exp(-t * uRipDecay);
    }
  ` + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
    for (int i = 0; i < DROPS; i++) {
      float t = uRipTime[i];
      if (t < 0.0) continue;
      vec3 rDir = position - uRipCenter[i]; float d = length(rDir);
      rDir = d > 1e-4 ? rDir / d : vec3(0.0);
      float slope = (dropWave(d + .01, t) - dropWave(max(d - .01, 0.0), t)) / .02 * uRipAmp;
      objectNormal -= rDir * slope * uRipNormal;
    }
    objectNormal = normalize(objectNormal);`);
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
    for (int i = 0; i < DROPS; i++) {
      if (uRipTime[i] >= 0.0) transformed += normal * dropWave(distance(position, uRipCenter[i]), uRipTime[i]) * uRipAmp;
    }`);
};

/* the object: a soft, pebble-like sculpture (smooth, indexed sphere pushed by layered waves) */
const geo = new THREE.SphereGeometry(1, 256, 192);
const p = geo.attributes.position, v = new THREE.Vector3();
for (let i = 0; i < p.count; i++) {
  v.fromBufferAttribute(p, i);
  const n = v.clone().normalize();
  const bump = 1
    + .16 * Math.sin(2.1 * n.x + 1.3) * Math.sin(2.6 * n.y + .4)
    + .10 * Math.sin(3.4 * n.z + 2.0 * n.y + .7)
    + .06 * Math.sin(5.2 * n.x - 3.1 * n.z + 1.9)
    - .14 * Math.exp(-Math.pow((n.y - .15) * 3.2, 2)) * Math.max(0, n.z); // a soft waist on the front
  v.copy(n).multiplyScalar(bump);
  v.y *= 1.28;
  p.setXYZ(i, v.x, v.y, v.z);
}
geo.computeVertexNormals();
geo.computeBoundingBox();
const size = new THREE.Vector3(); geo.boundingBox.getSize(size);
const center = new THREE.Vector3(); geo.boundingBox.getCenter(center);
geo.translate(-center.x, -center.y, -center.z);

const holder = new THREE.Group();
scene.add(holder);
const mesh = new THREE.Mesh(geo, material);
const baseScale = 2.6 * .96 / size.y;
geo.computeBoundingSphere();
const HERO_R = geo.boundingSphere.radius;
// the object on screen: the first (pebble) object, or the open work's object — all share the same moves
let subject = mesh;
holder.add(mesh);

let mobileScale = innerWidth <= 640 ? 1.4 : 1;
const applyScale = (k = 1) => holder.scale.setScalar(baseScale * mobileScale * k);
applyScale();
addEventListener('resize', () => { resize(); mobileScale = innerWidth <= 640 ? 1.4 : 1; applyScale(); });

/* pointer follow */
let tx = 0, ty = 0, rx = 0, ry = 0;
addEventListener('pointermove', e => {
  if (innerWidth <= 640) return;
  tx = (e.clientX / innerWidth * 2 - 1) * TILT_Y;
  ty = (e.clientY / innerHeight * 2 - 1) * TILT_X;
});

/* click: centre → ripple, sides → full spin */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const RIP_TOTAL = .7, SPIN_DUR = 1.15, SIDE = .5;
const pressIn = (RIP_TOTAL - .05) / 2, pressOut = pressIn + .05, pressEnd = pressIn + pressOut;
let ripT = -1, spinT = -1, spinDir = 1, introDone = false;
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeSine = t => -(Math.cos(Math.PI * t) - 1) / 2;

function clickEffect(hit) {
  if (Math.abs(hit.point.x) >= SIDE) {
    if (spinT < 0) { spinT = 0; spinDir = hit.point.x >= 0 ? 1 : -1; }
    return;
  }
  // every click drops a new drop right away, even while earlier ones are still spreading
  dropC[nextDrop].copy(hit.object.worldToLocal(hit.point.clone()));
  dropT[nextDrop] = 0;
  nextDrop = (nextDrop + 1) % DROPS;
  ripT = 0;
}

/* drag anywhere on the canvas to turn the object all the way round (360°);
   a plain click on the object still makes the ripple / spin */
const DRAG_Y = .009;               // radians per px, left-right (≈ one full turn per 700px)
const DRAG_X = .006;               // radians per px, up-down
const MAX_PITCH = 1.3;             // keep the up-down view within about ±75°
let press = null, dragging = false, lastPX = 0, lastPY = 0;
let viewY = 0, viewX = 0, viewVY = 0, viewVX = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (!introDone || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  press = { x: e.clientX, y: e.clientY, hit: ray.intersectObject(subject, true)[0] || null };
  dragging = false;
  lastPX = e.clientX; lastPY = e.clientY;
  viewVY = viewVX = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!press) return;
  if (!dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5) {
    dragging = true;
    renderer.domElement.style.cursor = 'grabbing';
  }
  if (!dragging) return;
  const mx = e.clientX - lastPX, my = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  viewVY = mx * DRAG_Y;
  viewVX = my * DRAG_X;
  viewY += viewVY;
  viewX = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, viewX + viewVX));
});
const endPress = () => {
  if (!press) return;
  if (!dragging && press.hit) clickEffect(press.hit);
  press = null;
  dragging = false;
  renderer.domElement.style.cursor = '';
};
renderer.domElement.addEventListener('pointerup', endPress);
renderer.domElement.addEventListener('pointercancel', endPress);

/* scroll: the object swells or shrinks with the wheel (a small springy bounce) and keeps that size */
const WHEEL_GROW = .0025;          // size change per wheel step (down = bigger, up = smaller)
const WHEEL_MIN = -.35, WHEEL_MAX = .6;
const WHEEL_DRIFT = .45;           // vertical drift at full size change (scene units)
let wheelAcc = 0;
let sc = 1, scV = 0, driftY = 0, driftV = 0;
addEventListener('wheel', e => {
  if (!introDone || innerWidth <= 640) return;
  const d = Math.max(-120, Math.min(120, e.deltaY));
  wheelAcc = Math.max(WHEEL_MIN, Math.min(WHEEL_MAX, wheelAcc + d * WHEEL_GROW));
}, { passive: true });

const clock = new THREE.Clock();
let time = 0, introT = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), .05);
  time += dt;

  let spin = 0;
  if (spinT >= 0) {
    spinT += dt;
    const k = Math.min(spinT / SPIN_DUR, 1);
    spin = spinDir * Math.PI * 2 * easeInOutCubic(k);
    if (k >= 1) spinT = -1;
  }

  introT += dt;
  const ik = Math.min(introT / INTRO, 1);
  if (!introDone) {
    veil.style.opacity = String(1 - ik);
    if (ik >= 1) {
      veil.style.display = 'none';

  // 2 · heavy ring
  () => { const m = new THREE.Mesh(new THREE.TorusGeometry(1, .42, 96, 192), chrome); m.scale.z = .72; return m; },

  () => new THREE.Mesh(lathe(t => .32 + .3 * Math.pow(Math.abs(Math.sin(t * Math.PI * 4)), .6) * Math.sin(t * Math.PI)), chrome),
  // 4 · faceted gem

/* the hovered / open work: its object takes the first object's place in the main view (white background),

<script>
(() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- items ---------- */
  // 8 slots in the strip, one 3D object each. Projects are dealt out in turn
  // (5 projects → the first 3 get a second slot). Change SLOTS to show more or fewer.
  const SLOTS = 8;
  const perProject = PROJECTS.map((p, pi) => Math.floor(SLOTS / PROJECTS.length) + (pi < SLOTS % PROJECTS.length ? 1 : 0));
  const ITEMS = [];
  for (let s = 0; s < SLOTS && PROJECTS.length; s++) {
    const pi = s % PROJECTS.length, p = PROJECTS[pi], ii = Math.floor(s / PROJECTS.length);
    ITEMS.push({
      title: p.title, info: p.info, project: pi, idx: ii + 1, total: perProject[pi], src: '', model: p.models[ii] || '',
      letter: String.fromCharCode(65 + pi), num: String(s + 1).padStart(2, '0'), k: s,
    });
  }
  const liveWork = it => dispatchEvent(new CustomEvent('objectwork', { detail: it ? { it, k: it.k } : null }));
  const label = it => `${it.title} ${it.idx}/${it.total}`;
  const workCase = document.getElementById('workCase');
  const workInfo = document.getElementById('workInfo');
  const setCase = it => { workCase.href = `project-detail.html?project=${String(it.project + 1).padStart(2, '0')}`; workInfo.textContent = it.info; };
  const detailUrl = it => `project-detail.html?project=${String(it.project + 1).padStart(2, '0')}`;

  const ARS = ['4 / 5', '1 / 1', '3 / 2', '4 / 5', '2 / 3'];
  function placeholder(it, k) {
    const ar = ARS[(it.project + it.idx) % ARS.length];
    const [aw, ah] = ar.split('/').map(Number);
    const h = 1000, w = Math.round(h * aw / ah);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const tone = 214 + (it.project * 9 + it.idx * 5) % 30;
    g.fillStyle = `rgb(${tone},${tone},${tone})`; g.fillRect(0, 0, w, h);
    const cx = w * (.4 + (it.idx % 3) * .1), cy = h * .5, r = Math.min(w, h) * (.18 + (it.project % 4) * .035);
    g.fillStyle = 'rgba(0,0,0,.09)'; g.beginPath(); g.ellipse(cx + r * .2, cy + r * 1.08, r * 1.1, r * .2, 0, 0, Math.PI * 2); g.fill();
    const sh = g.createRadialGradient(cx - r * .35, cy - r * .4, r * .08, cx, cy, r * 1.15);
    sh.addColorStop(0, '#fafafa'); sh.addColorStop(.55, '#b9b9b9'); sh.addColorStop(1, '#5f5f5f');
    g.fillStyle = sh; g.beginPath();

  const carousel = document.getElementById('carousel');
  const playCarousel = document.getElementById('playCarousel');
  const workName = document.getElementById('workName');
  const QT = 40, SPEED_S = 1.5, N = ITEMS.length, STRIP = N * QT, SPEED = QT / SPEED_S, EDGE = 24;

  function makeThumb(it, i, first) {
    const t = document.createElement('div');
    t.className = 'thumb preview';
    t.dataset.i = i;
    t.innerHTML = `<img alt="" src="${it.url}">${first ? '<span class="tile-work">Work</span>' : ''}<span class="tile-letter">${it.letter}</span><span class="tile-num">${it.num}</span>`;
    return t;
  }

  /* ---------- big artwork (two layers for cross-fades) ---------- */
  const bgA = document.getElementById('workBg'), bgB = bgA.cloneNode(false);

      el.dataset.cur = url;

    };
    const im = new Image(); im.src = url;
    (im.decode ? im.decode() : Promise.reject()).then(go).catch(go);
  }
  function openWork(it) {
    workName.textContent = label(it); setCase(it);
    document.body.classList.add('work-open');
    liveWork(it);
    const el = layers[front];

  }
  function closeWork() {
    ++token; shown = false;
    liveWork(null);
    layers.forEach(l => { l.classList.remove('show', 'entering'); l.classList.add('leaving'); });
    document.body.classList.remove('work-open');
  }

  /* ---------- drum projection (items squeeze toward the edges) ---------- */

  let dragging = false, dragX = 0, dragB = 0, sy = 1, syTarget = 1, raf = 0, lastT = 0, morphing = false;
  let copies = 1, offset = 0, cloned = false;
  const mod = (a, n) => ((a % n) + n) % n;

  addEventListener('resize', () => { centre = innerWidth / 2; });

  function buildClones() {

    });
  }
  function layoutPlay() {

    if (document.body.classList.contains('idle')) return;

  }
  function show(i) {

    const it = ITEMS[i];
    document.body.classList.add('work-open');
    workName.textContent = label(it); setCase(it);
    liveWork(it);
    const el = layers[front];
    const visibleNow = el.classList.contains('show');

  };

  function stopPlay() {

    ++token; shown = false;
    liveWork(null);
    layers.forEach(l => { l.classList.remove('show', 'leaving', 'entering'); l.style.backgroundImage = ''; l.dataset.cur = ''; });
    setTimeout(() => { if (!playing) { sy = syTarget = 1; B = 0; layoutPlay(); workName.textContent = ''; } }, 900);
  }

  carousel.addEventListener('click', () => { if (!playing) startPlay(); });
  carousel.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startPlay(); } });
  const closeBtn = document.getElementById('minimise');
  closeBtn.addEventListener('click', stopPlay);
  closeBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stopPlay(); } });

  function layoutBrowse() {

  }
  addEventListener('resize', layoutBrowse);

  // intro: the strip spins in from the right
  function spinIn() {
    const cx = innerWidth / 2, W = innerWidth;
    const set = off => {
      carousel.style.transform = `translateX(${-20 + off * QT}px)`;
      for (let c = 0; c < thumbs.length; c++) {
        const x = cx + (c + off) * QT;
        if (x >= EDGE && x <= W - EDGE) project(thumbs[c], x, cx);
        else if (thumbs[c].style.transform !== 'scaleX(0)') thumbs[c].style.transform = 'scaleX(0)';
      }
    };
    set(20);
    document.documentElement.classList.remove('intro-pending');
    document.body.classList.add('intro-spinning');
    const start = performance.now();
    const step = () => {
      const k = Math.max(0, Math.min(1, (performance.now() - start) / 1200));
      set(20 * Math.pow(1 - k, 3));
      if (k < 1) { requestAnimationFrame(step); return; }
      carousel.style.transform = '';
      document.body.classList.remove('intro-spinning');
      layoutBrowse();
    };
    requestAnimationFrame(step);
  }

  /* ---------- phones: stacked images + current title ---------- */
  function buildMobile() {
    const stack = document.getElementById('mediaStack');
    ITEMS.forEach(it => {
      const d = document.createElement('div');   // no link: tapping an object doesn't leave the page
      d.className = 'media-item'; d.dataset.label = label(it);
      d.innerHTML = `<img alt="${it.title}" src="${it.url}" loading="lazy">`;
      stack.appendChild(d);
    });
    const tag = document.getElementById('mobileWork'), name = document.getElementById('mobileWorkName');
    if (!('IntersectionObserver' in window)) return;
    const seen = new Set();
    const io = new IntersectionObserver(list => {
      list.forEach(en => en.isIntersecting ? seen.add(en.target) : seen.delete(en.target));
      const last = [...seen].pop();
      if (last) { name.textContent = last.dataset.label; tag.classList.add('show'); } else tag.classList.remove('show');
    }, { rootMargin: '-50% 0px -50% 0px' });
    stack.querySelectorAll('.media-item').forEach(m => io.observe(m));
  }

  /* ---------- boot ---------- */
  Promise.all(ITEMS.map(load)).then(res => {
    res.forEach((r, k) => { ITEMS[k].url = r.url; ITEMS[k].ar = r.ar; });
    ITEMS.forEach((it, i) => { const t = makeThumb(it, i, i === 0); carousel.appendChild(t); thumbs.push(t); });
    buildMobile();
    layoutBrowse();
    let started = false;
    const go = () => {
      if (started) return; started = true;
      if (getComputedStyle(carousel).display === 'none' || reduceMotion) {
        document.documentElement.classList.remove('intro-pending'); layoutBrowse(); return;
      }
      spinIn();
    };
    if (window.__objectIntroDone) go(); else addEventListener('objectintrodone', go, { once: true });
    setTimeout(() => {               // in case the 3D library could not load
      const veil = document.getElementById('veil');
      if (veil && !window.__objectIntroDone) veil.style.display = 'none';
      go();
    }, 4000);
  });

  /* ---------- left-middle: Seoul clock + count (Metal Craft layout) ---------- */
  document.getElementById('idleCount').textContent = `Object — ${PROJECTS.length} projects`;
  const clockEl = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const tickClock = () => { clockEl.textContent = `${fmt.format(new Date())}, Seoul`; };
  tickClock(); setInterval(tickClock, 1000);
})();
</script>
<script src="../site-cursor.js"></script>
</body>
