<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEOHYEON WI™ — Portfolio</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
  }

  button, a { font: inherit; color: inherit; }

  /* Main stage — rotating ring (same interaction as the Fashion page) */
  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    perspective-origin: 50% 50%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage.is-grabbing, .stage.is-grabbing * { cursor: grabbing !important; }

  .scene, .ring-outer, .ring-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }

  .ring-item, .hero {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    will-change: transform, opacity;
  }
  .ring-item { pointer-events: none; }
  .ring-item img, .hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .hero { cursor: pointer; }

  /* Bottom project control */
  .bottom {
    position: fixed;
    z-index: 100;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    align-items: baseline;
    font-size: 15px;
    line-height: 1;
    color: #050505;
    white-space: nowrap;
    transition: opacity .15s ease-in-out;
  }
  .bottom.is-out { opacity: 0; }

  .bottom button {
    border: 0;
    background: transparent;
    color: #050505;
    padding: 0;
    font-size: inherit;
    line-height: inherit;
    cursor: pointer;
  }

  .bottom a {
    text-decoration: none;
    color: #8c8c8c;
    transition: color .2s ease;
  }
  .bottom a:hover { color: #050505; }

  /* Small helper */
  .hint {
    position: fixed;
    z-index: 90;
    left: 50%;
    bottom: 44px;
    transform: translateX(-50%);
    font-size: 9px;
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .bottom { bottom: 18px; font-size: 12px; gap: 10px; }
  }
</style>
<link rel="stylesheet" href="../site-nav.css">
<link rel="stylesheet" href="../site-cursor.css">
</head>
<body>

<header class="site-top">
  <a class="site-name" href="../index.html">SEOHYEON WI™</a>
  <nav class="site-cats" aria-label="Work categories">
    <a href="../fashion.html">Fashion</a>
    <a href="index.html" class="is-active" aria-current="page">3D</a>
    <a href="../seohyeon_wi_projects_interactive_v2.html?category=metal-craft">Metal Craft</a>
    <a href="../seohyeon_wi_projects_interactive_v2.html?category=product">Product</a>
    <a href="../seohyeon_wi_projects_interactive_v2.html">Archive</a>
  </nav>
  <nav class="site-info" aria-label="About and contact">
    <a href="../about.html">About</a>
    <a href="../contact.html">Contact</a>
  </nav>
</header>

<main class="stage" id="stage" aria-label="Rotating 3D gallery. Drag, scroll, or use arrow keys to rotate.">
  <div class="scene">
    <a class="hero" id="hero" href="project-detail.html?project=01" aria-label="View case"><img id="heroImg" alt=""></a>
    <div class="ring-outer" id="ringOuter">
      <div class="ring-inner" id="ringInner"></div>
    </div>
  </div>
</main>

<div class="hint" id="hint">DRAG TO ROTATE</div>

<div class="bottom" id="bottom">
  <button id="projectName">Project 01</button>
  <a href="project-detail.html?project=01" id="viewCase">View Case →</a>
</div>

<script>
  /*
    3D 프로젝트 목록 — 실제 이미지를 넣으려면 src 에 경로를 적어주세요.
    (예: src: '../images/3d/01.jpg')  비워두면 회색 임시 이미지가 표시됩니다.
  */
  const projects = [
    { name: 'Project 01', src: '' },
    { name: 'Project 02', src: '' },
    { name: 'Project 03', src: '' },
    { name: 'Project 04', src: '' },
    { name: 'Project 05', src: '' },
    { name: 'Project 06', src: '' },
    { name: 'Project 07', src: '' },
    { name: 'Project 08', src: '' },
  ];
  const detailUrl = i => `project-detail.html?project=${String(i + 1).padStart(2, '0')}`;

  (() => {
    const CAMERA_Z = 8;
    const FOV = 45;
    const VIEW_UNITS = 2 * CAMERA_Z * Math.tan((FOV / 2) * Math.PI / 180);
    const HERO_H = 3.1;
    const ITEM_H = 0.68;
    const INTRO_SCALE = 2.5;

    const stage = document.getElementById('stage');
    const ringOuter = document.getElementById('ringOuter');
    const ringInner = document.getElementById('ringInner');
    const hero = document.getElementById('hero');
    const heroImg = document.getElementById('heroImg');
    const bottom = document.getElementById('bottom');
    const projectName = document.getElementById('projectName');
    const viewCase = document.getElementById('viewCase');
    const hint = document.getElementById('hint');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const count = projects.length;
    const step = Math.PI * 2 / count;

    let unit = 1, radius = 3, items = [];
    let heroState = { o: 0, aspect: 2 / 3 };
    let current = 0, target = 0;
    let tiltX = 0, tiltXTarget = 0, tiltY = 0, tiltYTarget = 0;
    let intro = true, activeIndex = -1, keyReady = true;

    /* gray placeholder in the same style as the old 3D cards */
    const GRAYS = ['#e8e8e8', '#e3e3e3', '#ededed', '#e7e7e7'];
    function placeholder(i) {
      const w = 540, h = 810;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = i % 4 === 3 ? GRAYS[3] : i % 3 === 2 ? GRAYS[2] : i % 2 === 1 ? GRAYS[1] : GRAYS[0];
      g.fillRect(0, 0, w, h);
      g.globalAlpha = .24;
      g.strokeStyle = '#fff'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(w * .35, 0); g.lineTo(w, h * .65); g.stroke();
      g.fillStyle = 'rgba(0,0,0,.08)';
      g.beginPath(); g.moveTo(0, h * .6); g.lineTo(w * .55, h); g.lineTo(w * .4, h); g.lineTo(0, h * .75); g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = '#ededed'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
      g.fillStyle = '#000';
      g.font = '20px Arial, Helvetica, sans-serif';
      g.fillText(String(i + 1).padStart(2, '0'), 20, 40);
      g.font = '22px Arial, Helvetica, sans-serif';
      g.fillText(projects[i].name, 20, h - 22);
      return c.toDataURL('image/png');
    }

    function loadImage(p, i) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve({ src: img.src, aspect: img.naturalWidth / img.naturalHeight || 2 / 3 });
        img.onerror = () => { img.onerror = null; img.src = placeholder(i); };
        img.src = p.src || placeholder(i);
      });
    }

    /* tiny tween engine */
    const tweens = [];
    const easeOut = t => 1 - (1 - t) * (1 - t);
    function tween(obj, to, { duration = 1, delay = 0 } = {}) {
      tweens.push({ obj, to, from: null, duration, start: performance.now() + delay * 1000 });
    }
    function runTweens(now) {
      for (let i = tweens.length - 1; i >= 0; i--) {
        const t = tweens[i];
        if (now < t.start) continue;
        if (!t.from) { t.from = {}; for (const k in t.to) t.from[k] = t.obj[k]; }
        const p = Math.min(1, (now - t.start) / (t.duration * 1000));
        const e = easeOut(p);
        for (const k in t.to) t.obj[k] = t.from[k] + (t.to[k] - t.from[k]) * e;
        if (p >= 1) tweens.splice(i, 1);
      }
    }

    function layout() {
      unit = window.innerHeight / VIEW_UNITS;
      radius = window.innerWidth <= 768 ? 1.8 : 3;
      stage.style.perspective = `${CAMERA_Z * unit}px`;
      items.forEach(item => {
        item.el.style.width = `${item.w * unit}px`;
        item.el.style.height = `${item.h * unit}px`;
        item.el.style.marginLeft = `${-item.w * unit / 2}px`;
        item.el.style.marginTop = `${-item.h * unit / 2}px`;
      });
      sizeHero();
      if (!intro) items.forEach((item, i) => {
        item.x = Math.sin(step * i) * radius;
        item.z = Math.cos(step * i) * radius;
      });
    }

    function sizeHero() {
      let h = HERO_H * unit, w = HERO_H * heroState.aspect * unit;
      // wide images shrink so they never overflow a phone screen
      const maxW = innerWidth * (innerWidth <= 700 ? 0.86 : 0.9);
      if (w > maxW) { h *= maxW / w; w = maxW; }
      hero.style.width = `${w}px`;
      hero.style.height = `${h}px`;
      hero.style.marginLeft = `${-w / 2}px`;
      hero.style.marginTop = `${-h / 2}px`;
    }

    function setActive(i) {
      activeIndex = i;
      heroImg.src = items[i].src;
      heroImg.alt = projects[i].name;
      heroState.aspect = items[i].aspect;
      sizeHero();
      hero.href = detailUrl(i);
      bottom.classList.add('is-out');
      clearTimeout(setActive.timer);
      setActive.timer = setTimeout(() => {
        projectName.textContent = projects[i].name;
        viewCase.href = detailUrl(i);
        bottom.classList.remove('is-out');
      }, 150);
    }

    function nearestToFront() {
      let best = 0, min = Infinity;
      for (let i = 0; i < count; i++) {
        let a = ((current + step * i) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        if (a > Math.PI) a = Math.PI * 2 - a;
        if (a < min) { min = a; best = i; }
      }
      return best;
    }

    function frame(now) {
      runTweens(now);
      if (!intro) {
        current += (target - current) * 0.08;
        tiltX += (tiltXTarget - tiltX) * 0.08;
        tiltY += (tiltYTarget - tiltY) * 0.05;
      }
      ringOuter.style.transform = `rotateX(${-tiltX}rad) rotateY(${tiltY}rad)`;
      ringInner.style.transform = `rotateY(${current}rad)`;
      for (const item of items) {
        const facing = Math.atan2(item.x, item.z);
        item.el.style.transform =
          `translate3d(${item.x * unit}px, 0, ${item.z * unit}px) rotateY(${facing}rad) scale(${item.s})`;
        item.el.style.opacity = item.o;
      }
      hero.style.opacity = heroState.o;
      if (!intro) {
        const front = nearestToFront();
        if (front !== activeIndex) setActive(front);
      }
      requestAnimationFrame(frame);
    }

    function playIntro() {
      const n = items.length;
      items.forEach((item, i) => tween(item, { o: 1 }, { duration: .8, delay: .8 * i / (n - 1) }));
      const spread = 1.4;
      items.forEach((item, i) => {
        tween(item, { x: Math.sin(step * i) * radius, z: Math.cos(step * i) * radius },
          { duration: 1.55, delay: spread + .04 * i });
        tween(item, { s: 1 }, { duration: 1, delay: spread + .04 * i });
      });
      const spin = { r: 0 };
      tween(spin, { r: -(step * 10) }, { duration: 3, delay: spread });
      (function follow() {
        current = spin.r;
        if (intro) requestAnimationFrame(follow);
      })();
      tween(heroState, { o: 1 }, { duration: .5, delay: spread + .9 });
      setTimeout(() => {
        intro = false;
        current = target = spin.r;
        hint.style.opacity = 1;
        setTimeout(() => { hint.style.opacity = 0; }, 2500);
      }, (spread + 3) * 1000 + 30);
    }

    function skipIntro() {
      items.forEach((item, i) => {
        item.x = Math.sin(step * i) * radius;
        item.z = Math.cos(step * i) * radius;
        item.s = 1; item.o = 1;
      });
      heroState.o = 1;
      intro = false;
    }

    /* interaction */
    let dragging = false, dragStartX = 0, dragStartTarget = 0, dragDelta = 0;
    const dragSpeed = () => 5 / window.innerWidth;
    const snap = () => { target = Math.round(target / step) * step; };

    window.addEventListener('wheel', e => {
      e.preventDefault();
      if (!intro) target += e.deltaY * 0.003;
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (intro) return;
      if (e.key === 'Enter' && document.activeElement === document.body) {
        location.href = detailUrl(activeIndex);
        return;
      }
      if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || !keyReady) return;
      e.preventDefault();
      keyReady = false;
      target = (Math.round(target / step) + (e.key === 'ArrowRight' ? 1 : -1)) * step;
      setTimeout(() => { keyReady = true; }, 700);
    });

    window.addEventListener('mousemove', e => {
      if (!reduceMotion) {
        tiltXTarget = (e.clientY / window.innerHeight - .5) * .24;
        tiltYTarget = (e.clientX / window.innerWidth - .5) * .12;
      }
      if (!dragging) return;
      dragDelta = e.clientX - dragStartX;
      target = dragStartTarget + dragDelta * dragSpeed();
    });

    stage.addEventListener('mousedown', e => {
      if (intro || e.button !== 0) return;
      e.preventDefault();
      dragging = true;
      dragStartX = e.clientX;
      dragStartTarget = target;
      dragDelta = 0;
      stage.classList.add('is-grabbing');
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      stage.classList.remove('is-grabbing');
      snap();
    });

    stage.addEventListener('touchstart', e => {
      if (intro) return;
      dragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartTarget = target;
      dragDelta = 0;
    }, { passive: true });

    stage.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!dragging) return;
      const t = e.touches[0];
      dragDelta = t.clientX - dragStartX;
      target = dragStartTarget + dragDelta * dragSpeed();
      // the ring tilts a little toward the finger, like it does for the mouse
      if (!reduceMotion) {
        tiltXTarget = (t.clientY / innerHeight - .5) * .24;
        tiltYTarget = (t.clientX / innerWidth - .5) * .12;
      }
    }, { passive: false });

    stage.addEventListener('touchend', () => {
      tiltXTarget = tiltYTarget = 0;
      if (!dragging) return;
      dragging = false;
      snap();
    });

    // a drag must not count as a click on the centre image
    hero.addEventListener('click', e => {
      if (intro || Math.abs(dragDelta) > 5) e.preventDefault();
    });
    projectName.addEventListener('click', () => { if (activeIndex >= 0) location.href = detailUrl(activeIndex); });

    window.addEventListener('resize', layout);

    /* boot */
    Promise.all(projects.map(loadImage)).then(loaded => {
      items = loaded.map((data, i) => {
        const el = document.createElement('figure');
        el.className = 'ring-item';
        el.style.margin = '0';
        const img = document.createElement('img');
        img.src = data.src;
        img.alt = '';
        el.appendChild(img);
        ringInner.appendChild(el);
        return { el, src: data.src, aspect: data.aspect, w: ITEM_H * data.aspect, h: ITEM_H, x: 0, z: 3, s: INTRO_SCALE, o: 0 };
      });
      layout();
      items.forEach((item, i) => { item.z = radius + i * 0.01; });
      setActive(0);
      requestAnimationFrame(frame);
      if (reduceMotion) skipIntro();
      else setTimeout(playIntro, 200);
    });
  })();

</script>

<script src="../site-cursor.js"></script>
</body>
</html>
