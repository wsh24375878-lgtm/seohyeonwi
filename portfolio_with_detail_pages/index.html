<!DOCTYPE html>
<html lang="ko" class="intro-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object — SEOHYEON WI™</title>
<style>
  :root { --pad: 24px; --font: Arial, Helvetica, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #fff; color: #050505; }
  body { font-family: var(--font); font-weight: 400; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  a { color: inherit; text-decoration: none; }
  .muted { color: #8c8c8c; }

  /* ---------- 3D object ---------- */
  #app { position: fixed; inset: 0; z-index: 0; filter: contrast(1.22); }
  #app canvas { display: block; touch-action: none; }   /* phones: any drag on the object turns it (360°); scroll the page outside it */
  .veil { position: fixed; inset: 0; z-index: 1; background: #fff; pointer-events: none; }

  /* ---------- left-middle text (same 15px type as the main page) ---------- */
  .meta, .work-meta { position: fixed; z-index: 5; left: var(--pad); top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; transition: opacity .18s ease; }
  .work-meta { opacity: 0; }
  /* right-middle hint (Metal Craft layout) */
  .side-hint { position: fixed; z-index: 5; right: var(--pad); top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1.3; text-align: right; pointer-events: none; transition: opacity .18s ease; }
  body.work-open .side-hint, body.playing .side-hint { opacity: 0; }
  .work-meta a { pointer-events: auto; transition: color .2s ease; }
  .work-meta a:hover { color: #050505; }
  .work-link, .work-link > span { display: block; }

  /* ---------- Product page (index.html?cat=product): a 2D cut-out photo in the middle instead of the 3D object ---------- */
  .product-stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  /* fixed box (not max-*) so every photo fills the same area whatever its pixel size */
  /* mix-blend-mode: multiply — the photos' white backgrounds melt into the white page, so no white box shows while two photos cross-fade */
  .product-stage img { position: absolute; width: min(52vw, 720px); height: 54vh; object-fit: contain; mix-blend-mode: multiply;
    opacity: 0; transform: scale(var(--size, 1));
    transition: opacity .45s ease;
    animation: productFloat 6s ease-in-out infinite; -webkit-user-drag: none; }
  .product-stage img.on { opacity: 1; pointer-events: auto; cursor: pointer; }
  /* Product: previous / next — a short arrow either side of the photo (tall invisible hit area around it) */
  .p-nav { position: fixed; top: 50%; z-index: 30; width: 72px; height: 40vh; margin-top: -20vh; padding: 0;
    display: flex; align-items: center; justify-content: center; border: 0; background: none;
    color: #050505; cursor: pointer; transition: transform .25s ease; }
  .p-dot { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
    color: #8c8c8c; transition: color .2s ease; }   /* just the arrow — no circle */
  .p-nav:hover .p-dot { color: #050505; }
  .p-nav-prev:hover { transform: translateX(-4px); }
  .p-nav-next:hover { transform: translateX(4px); }
  .p-nav svg { display: block; overflow: visible; }
  .p-nav:focus-visible { outline: none; }
  .p-nav:focus-visible .p-dot { color: #050505; }
  /* just outside the photo (at most min(52vw, 720px) wide), clear of the side text and Close */
  .p-nav-prev { left: max(200px, calc(50% - min(26vw, 360px) - 96px)); }
  .p-nav-next { right: max(110px, calc(50% - min(26vw, 360px) - 96px)); }
  @media (max-width: 700px) {
    .p-nav { width: 44px; height: 30vh; margin-top: -15vh; top: calc(50% - 22px); }
    .p-dot { width: 32px; height: 32px; }
    .p-nav-prev { left: 0; }
    .p-nav-next { right: 0; }
  }
  /* Product: kind filter, a quiet second row under the category links */
  .p-kinds { position: fixed; z-index: 99; top: 46px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;
    font: 400 13px/1 Arial, Helvetica, sans-serif; white-space: nowrap; }
  .p-kinds a { color: #8c8c8c; text-decoration: none; transition: color .2s ease; }
  .p-kinds a:hover, .p-kinds a.is-active { color: #050505; }
  .p-kinds a.is-active { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  @media (max-width: 700px) {
    .p-kinds { top: 66px; left: 14px; right: 14px; transform: none; gap: 12px; font-size: 12px;
      overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .p-kinds::-webkit-scrollbar { display: none; }
  }
  /* strip: faded like the phone strip; the product on show (or under the mouse) at full strength */
  .carousel .thumb img { opacity: .45; transition: opacity .25s ease, filter .3s ease; }
  .carousel .thumb.is-current img { opacity: 1; }
  @media (hover: hover) { .carousel .thumb:hover img { opacity: 1; } }
  /* Product: the strip is black & white like the 3D page — only the product on show (or under the mouse) is in colour */
  .is-product .carousel .thumb img { filter: grayscale(1); }
  .is-product .carousel .thumb.is-current img { filter: none; }
  @media (hover: hover) { .is-product .carousel .thumb:hover img { filter: none; } }
  .is-product .m-cell { filter: grayscale(1); transition: opacity .25s ease, transform .25s ease, filter .3s ease; }
  .is-product .m-cell.is-current { filter: none; }
  @keyframes productFloat { 50% { translate: 0 -10px; } }
  .product-empty { font-size: 15px; margin: 0; }
  @media (max-width: 700px) {
    .product-stage { bottom: 168px; top: 124px; }      /* between the menu (+ kind row) and the strip, with room to breathe */
    .product-stage img { width: 76vw; height: 100%; }
  }
  .is-product .side-hint { display: none; }
  .is-product #app { filter: none; }
  /* no works yet: hide the strip */
  .is-empty #carousel, .is-empty .carousel-label, .is-empty .m-strip, .is-empty .m-mark { display: none !important; }
  /* "click to spin" tag next to the cursor on the object's edge */
  .spin-tag { position: fixed; z-index: 9998; left: 0; top: 0; pointer-events: none; white-space: nowrap;
    font-size: 13px; line-height: 1; color: #050505; background: #fff; padding: 4px 6px;
    transform: translate(14px, -50%); opacity: 0; transition: opacity .18s ease; }
  .spin-tag.left { transform: translate(calc(-100% - 14px), -50%); }
  .spin-tag.on { opacity: 1; }
  /* 3D: "Drop & spin" button (the water drop + full turn that used to be on click) */
  .fx-btn { position: fixed; z-index: 7; right: var(--pad); top: calc(50% + 46px); padding: 0; border: 0; background: none;
    font: 400 15px/1.3 Arial, Helvetica, sans-serif; color: #8c8c8c; cursor: pointer; transition: color .2s ease; }
  .fx-btn:hover { color: #050505; }
  @media (max-width: 700px) { .fx-btn { top: auto; right: 14px; bottom: calc(18px + 56px + 44px + env(safe-area-inset-bottom)); font-size: 12px; } }
  /* 3D: finish picker on the right under "Drop & spin" — dots only, no words. The chosen finish is the one
     in full strength and a little larger; the others step back (faded, smaller) instead of a frame */
  .mat-row { position: fixed; z-index: 7; right: var(--pad); top: calc(50% + 88px); display: flex; align-items: center; gap: 12px; }
  .sw { padding: 0; border: 0; background: none; cursor: pointer; opacity: .55; transition: opacity .25s ease; }
  .sw:hover { opacity: .85; }
  .sw.is-active { opacity: 1; }
  .sw-name { display: none; }
  .sw-dot { display: block; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    transform: scale(.82); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .sw.is-active .sw-dot { transform: scale(1.15); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.18); }
  .sw-chrome .sw-dot { background: linear-gradient(135deg, #fff 0%, #9a9a9a 45%, #f2f2f2 70%, #7d7d7d 100%); }
  .sw-satin .sw-dot  { background: linear-gradient(135deg, #f0f0f0, #bdbdbd); }
  .sw-black .sw-dot  { background: #111; }
  .sw-glass .sw-dot  { background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(205,220,230,.5)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
  @media (max-width: 700px) { .mat-row { top: 70px; right: auto; left: 14px; gap: 12px; } .sw-dot { width: 16px; height: 16px; } }  .p-kinds button { padding: 0; border: 0; background: none; font: inherit; color: #8c8c8c; cursor: pointer; transition: color .2s ease; }
  .p-kinds button:hover, .p-kinds button.is-active { color: #050505; }
  .p-kinds button.is-active { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  @media (hover: none), (pointer: coarse) { .spin-tag { display: none; } }
  .work-link:hover .case-arrow { color: #050505; }
  .work-link:hover #workName { text-decoration: underline; text-underline-offset: 3px; }
  body.work-open .work-meta { opacity: 1; }
  body.work-open .meta { opacity: 0; }
  body:not(.playing) .work-meta a { pointer-events: none; }

  /* ---------- project strip ---------- */
  .carousel { position: fixed; left: 50%; bottom: var(--pad); z-index: 3; transform: translateX(-20px); display: flex; align-items: flex-end; pointer-events: auto; cursor: pointer; }
  .carousel .thumb { position: relative; width: 40px; height: 55px; border: 0; border-radius: 2px; overflow: hidden; background: #fff; flex: none; transform-origin: center bottom; }
  .carousel .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  /* Product: the whole cut-out fits inside the white tile */
  /* Product: the photo sits small inside its slot (like the 3D objects), not filling it */
  .is-product .carousel .thumb img { inset: 11px 7px; width: calc(100% - 14px); height: calc(100% - 22px); object-fit: contain; }
  .tile-num, .tile-letter, .tile-work { display: none; }   /* no labels on the strip thumbs (3D / Product) */
  .tile-num, .tile-letter, .tile-work { position: absolute; z-index: 1; pointer-events: none; font-size: 9px; line-height: 1; color: #050505; font-variant-numeric: tabular-nums; }
  .tile-num { top: 4px; right: 3px; transform-origin: top right; }
  .tile-letter { bottom: 4px; left: 3px; transform-origin: bottom left; }
  .tile-work { top: 4px; left: 3px; transform-origin: top left; transition: opacity .18s ease; }
  #playCarousel .tile-work { display: none; }
  @media (hover: hover) { #carousel:hover .tile-work { opacity: 0; } }
  .carousel-label { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--pad) + 55px + 12px); font-size: 15px; line-height: 1; white-space: nowrap; color: #050505; z-index: 5; opacity: 0; transition: opacity .18s ease; pointer-events: none; }
  @media (hover: hover) { #carousel:hover + .carousel-label { opacity: 1; } }

  #playCarousel { left: 0; transform: none; pointer-events: none; transform-origin: center center; }

  /* ---------- full-height artwork ---------- */
  .work-bg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; height: 100vh; aspect-ratio: var(--work-ar, 4 / 5); max-width: 100vw; background-color: #f2f2f2; background-size: cover; background-position: center; opacity: 0; transition: opacity .3s ease, filter .3s ease; pointer-events: none; }
  .work-bg.show { opacity: 1; }
  .work-bg.entering { animation: workUnblur .3s ease; }
  .work-bg.leaving { filter: blur(22px); }
  @keyframes workUnblur { 0% { filter: blur(22px); } to { filter: blur(0); } }
  /* the hovered work's 3D object, moving, in the same frame as the artwork */
  .work-live { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; height: 100vh; aspect-ratio: 4 / 5; max-width: 100vw; background: #f2f2f2; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .work-live.show { opacity: 1; }
  .work-live canvas { display: block; width: 100% !important; height: 100% !important; }
  body.dragging .work-bg { transition: none; }

  .playhead { position: fixed; left: 50%; bottom: var(--pad); transform: translateX(-50%); width: 2px; height: 55px; background: #050505; border-radius: 2px; z-index: 6; pointer-events: none; }
  .minimise { position: fixed; right: var(--pad); top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1.3; cursor: pointer; z-index: 6; pointer-events: none; }
  body.playing .minimise { pointer-events: auto; }

  #app, #carousel, .meta { opacity: 1; transition: opacity .3s ease .3s; }
  body.playing #carousel, body.playing .meta { opacity: 0; pointer-events: none; transition: opacity .3s ease 0s; }
  /* every work's object is shown in the main 3D view on white (same moves as the first object),
     so the grey artwork frame and the old auto-turning preview are not used */
  .work-bg, .work-live { display: none !important; }
  .playhead, .minimise, #playCarousel { opacity: 0; transition: opacity .3s ease 0s; }
  body.playing .playhead, body.playing .minimise, body.playing #playCarousel { opacity: 1; transition: opacity .3s ease .3s; }
  body.playing .minimise { transition: opacity .18s ease; }
  @media (hover: hover) { body.playing .minimise:hover { opacity: .5; } }
  body.playing #playCarousel { transition: opacity .7s cubic-bezier(.33,0,.2,1) .3s; pointer-events: auto; cursor: ew-resize; touch-action: none; }
  body.morphing #playCarousel { opacity: 1; transition: none; }
  body.playing .work-meta { opacity: 1; }
  body.playing.idle #playCarousel, body.playing.idle .playhead { opacity: 0; }
  html.intro-pending #carousel { opacity: 0; pointer-events: none; }
  body.intro-spinning #carousel { opacity: 1; pointer-events: none; transition: none; }

  .media-stack, .mobile-work, .drag-hint, .m-strip, .m-head, .m-mark { display: none; }

  /* ---------- phones: the same full-screen object as on a computer;
     swipe the strip at the bottom sideways to switch objects, drag the object to turn it ---------- */
  @media (max-width: 700px) {
    :root { --pad: 14px; --cell: 44px; }
    #app { touch-action: none; }
    .meta, .carousel, .carousel-label, .playhead, .minimise, .work-bg, .work-live, .work-meta, .side-hint { display: none !important; }
    .m-strip { display: flex; position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5;
      gap: 4px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      padding: 0 calc(50% - var(--cell) / 2); scrollbar-width: none; touch-action: pan-x; }
    .m-strip::-webkit-scrollbar { display: none; }
    .m-cell { flex: 0 0 var(--cell); height: 56px; scroll-snap-align: center; background: #fff center / cover no-repeat;
      border-radius: 2px; opacity: .45; transform: scale(.86); transition: opacity .25s ease, transform .25s ease; }
    .m-cell.is-current { opacity: 1; transform: none; }
    .is-product .m-cell { background-size: contain; background-origin: content-box; padding: 10px 8px; }
    .m-cell.hero { background: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8c8c8c; }
    /* a thin black mark in the middle, like the playhead on a computer */
    .m-mark { display: block; position: fixed; left: 50%; bottom: calc(18px + 56px + 6px + env(safe-area-inset-bottom)); z-index: 6;
      width: 1px; height: 8px; margin-left: -.5px; background: #050505; pointer-events: none; }
    .m-head { display: block; position: fixed; left: 14px; right: 14px; bottom: calc(18px + 56px + 22px + env(safe-area-inset-bottom)); z-index: 5;
      text-align: center; font-size: 12px; line-height: 1.35; pointer-events: none; }
    .m-head .muted { display: block; }
    .m-head a { pointer-events: auto; }
  }
</style>

<script>
/*
  이 페이지 하나로 두 카테고리를 보여줘요.
  - 3D      : index.html             → works-data.js 의 object 목록 (가운데에 3D 오브젝트)
  - Product : index.html?cat=product → works-data.js 의 product 목록 (가운데에 2D 누끼 이미지)
  (작업을 바꾸려면 works-data.js 를 수정하세요. 경로는 사이트 폴더 기준이라 앞에 ../ 를 붙여요.)
*/
const PAGE_CAT = new URLSearchParams(location.search).get('cat') === 'product' ? 'product' : 'object';
const IS_PRODUCT = PAGE_CAT === 'product';
window.PAGE_CAT = PAGE_CAT;
const CAT_LABEL = IS_PRODUCT ? 'Product' : '3D';
// detail page link for a project (Product keeps its category in the address)
// (pi = index in the list on screen; orig = index in works-data.js, which the detail page uses)
const caseUrl = pi => `project-detail.html?project=${String((PROJECTS[pi] ? PROJECTS[pi].orig : pi) + 1).padStart(2, '0')}${IS_PRODUCT ? '&category=product' : ''}`;
// Product: ?kind=paperweight shows only that kind (works-data.js 의 kind)
const kindSlug = k => String(k || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const ALL_WORKS = window.OTHER_WORKS[PAGE_CAT] || [];
const KIND_ORDER = ['Living', 'Stationery', 'Accessories'];   // button order; any other kind goes after
const KINDS = IS_PRODUCT ? [...new Set(ALL_WORKS.map(w => w.kind).filter(Boolean))]
  .sort((a, b) => ((KIND_ORDER.indexOf(a) + 1) || 99) - ((KIND_ORDER.indexOf(b) + 1) || 99)) : [];
let KIND = IS_PRODUCT ? kindSlug(new URLSearchParams(location.search).get('kind')) : '';
if (!KINDS.some(k => kindSlug(k) === KIND)) KIND = '';
const PROJECTS = ALL_WORKS.map((w, orig) => ({ w, orig })).filter(({ w }) => !KIND || kindSlug(w.kind) === KIND).map(({ w, orig }) => ({
  orig,
  size: w.size || 1,                     // Product: display size of the centre photo (1 = normal)
  title: w.title,
  info: [w.type, w.year].filter(Boolean).join(', '),
  images: w.images.map(src => (src ? '../' + src : '')),
  // 3D 파일 자리: works-data.js 의 object 항목에 models: ['models/파일.glb', ...] 를 넣으면
  // 같은 순서의 칸이 그 모델로 바뀌어요. 비어 있으면 임시 3D 오브제가 들어가요.
  models: (w.models || []).map(src => (src ? '../' + src : '')),
  // Product: 누끼 이미지(배경 없는 PNG). cutouts 가 없으면 images 를 써요.
  cutouts: (w.cutouts || w.images || []).filter(Boolean).map(src => '../' + src),
}));
document.title = `${CAT_LABEL} — SEOHYEON WI™`;
document.documentElement.classList.toggle('is-product', IS_PRODUCT);
document.documentElement.classList.toggle('is-empty', !PROJECTS.length);
if (IS_PRODUCT) {
  const a = document.getElementById('nav3d'), b = document.getElementById('navProduct');
  a.classList.remove('is-active'); a.removeAttribute('aria-current');
  b.classList.add('is-active'); b.setAttribute('aria-current', 'page');
  // kind filter under the top bar: All · Fabric · Bead Curtain · …
  if (KINDS.length > 1) {
    const bar = document.createElement('nav');
    bar.className = 'p-kinds'; bar.setAttribute('aria-label', 'Product types');
    [['All', ''], ...KINDS.map(k => [k, kindSlug(k)])].forEach(([name, slug]) => {
      const a = document.createElement('a');
      a.href = 'index.html?cat=product' + (slug ? '&kind=' + slug : '');
      a.textContent = name;
      if (slug === KIND) { a.className = 'is-active'; a.setAttribute('aria-current', 'true'); }
      bar.appendChild(a);
    });
    document.querySelector('.site-top').after(bar);
  }
}
// the 3D renderer (module script below) hands over its snapshot function here
const objectSnap = new Promise(res => { window.setObjectSnap = res; });
</script>

<script type="module">
import * as THREE from 'three';

/* soft grey studio environment for the chrome reflections */
function studio(w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');

      gr.addColorStop(0, `rgba(${v},${v},${v},${a})`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
      g.fillStyle = gr; g.fillRect(x + off - r, y - r, r * 2, r * 2);

  for (let i = 0; i < 24; i++) blob(rnd() * w, rnd() * h, (.16 + rnd() * .32) * w, Math.round(255 * Math.pow(rnd(), 1.1)), .5 + rnd() * .3);
  for (let i = 0; i < 4; i++) blob(rnd() * w, (.36 + rnd() * .28) * h, (.15 + rnd() * .12) * w, 34 + Math.floor(rnd() * 22), .5);

  for (let i = 0; i < 18; i++) blob(rnd() * w, rnd() * h, (.03 + rnd() * .08) * w, 255, .95);

    uRipSpeed: { value: 2.2 },      // how fast the ring travels out
    uRipWavelength: { value: .32 },   // width of the ring
    uRipWidth: { value: .16 },        // length of the ring train (small = a single ring)
    uRipAmp: { value: .028 },         // ring height (small = one little drop)
    uRipNormal: { value: 1.2 },       // how strongly the ring bends the reflection

    viewX = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, viewX + viewVX)); viewVX *= .9;
  }

  holder.rotation.order = 'YXZ';   // turn around the vertical axis first, then tip
  holder.rotation.y = rx + spin + viewY;
  holder.rotation.x = ry - (1 - easeOutCubic(ik)) * INTRO_TILT + viewX;
  holder.position.y = Math.sin(time * BOB_FREQ) * BOB_AMP + driftY + (subject === mesh ? 0 : SUBJECT_LIFT);

  // switching works: the current one slides off to the side at full size,
  // then the next one slides in from the other side to the centre (like flipping through a carousel)
  let slideS = 1;
  holder.position.x = 0; holder.position.z = 0;
  const halfW = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z * camera.aspect;
  const off = halfW + 1.6;                                         // just past the screen edge
  if (!slide && (swipeLive || swipeDX)) {
    // phones: the object follows the finger; let go short of a swipe → it springs back
    if (!swipeLive && performance.now() > swipeHold) { swipeDX *= Math.exp(-dt * 12); if (Math.abs(swipeDX) < .5) swipeDX = 0; }
    const wpp = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z / innerHeight;   // world units per px
    holder.position.x = swipeDX * wpp;
    // same size throughout: only sideways (no shrinking / sinking back)
  }
  if (slide) {
    if (slide.fromX !== undefined) {                               // a swipe hands over: carry on from where the finger left it
      const u0 = Math.min(1, Math.abs(slide.fromX) / off);
      slide.t = .5 * Math.pow(u0, 1 / 2.2) * SLIDE_DUR;
      delete slide.fromX; swipeDX = 0; swipeHold = 0;
    }
    slide.t += dt;
    const k = Math.min(slide.t / SLIDE_DUR, 1);
    let u;
    if (k < .5) { u = Math.pow(k / .5, 2.2); holder.position.x = -slide.dir * off * u; }
    else {
      if (!slide.swapped) { setSubject(slide.obj); slide.swapped = true; }
      u = 1 - easeOutCubic((k - .5) / .5); holder.position.x = slide.dir * off * u;
    }
    // same size throughout: the work just slides sideways

    if (k >= 1) slide = null;
  }

  let press = 0;
  if (ripT >= 0) {
    if (ripT < pressIn) press = easeSine(ripT / pressIn);
    else if (ripT < pressEnd) press = 1 - easeSine((ripT - pressIn) / pressOut);
    ripT += dt;
    if (ripT > RIP_TOTAL) ripT = -1;
  }
  for (let i = 0; i < DROPS; i++) if (dropT[i] >= 0) { dropT[i] += dt; if (dropT[i] > RIP_TOTAL) dropT[i] = -1; }
  applyScale((1 - .012 * press) * sc * slideS);

  scene.environmentRotation.y += ENV_SPIN * dt;
  if (visible || !introDone) renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

/* =========================================================
   Strip works as 3D objects
   Each strip slot is rendered from a 3D object in the same chrome look.
   - A .glb listed in works-data.js (models: [...]) is used for that slot.
   - Otherwise a temporary object is made here (8 shapes, in turn).
   ========================================================= */
const SNAP_W = 960, SNAP_H = 1200;
const snapRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
snapRenderer.setPixelRatio(1);
snapRenderer.setSize(SNAP_W, SNAP_H, false);
snapRenderer.setClearColor(0x000000, 0);
snapRenderer.toneMapping = THREE.ACESFilmicToneMapping;
snapRenderer.toneMappingExposure = 1.05;
const snapScene = new THREE.Scene();
{
  const pm = new THREE.PMREMGenerator(snapRenderer);
  const t = studio();
  snapScene.environment = pm.fromEquirectangular(t).texture;
  t.dispose(); pm.dispose();
}
const snapCam = new THREE.PerspectiveCamera(30, SNAP_W / SNAP_H, .1, 100);
snapCam.position.set(0, 0, 10);

const chrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .04, envMapIntensity: 1.2 });
const chromeFlat = chrome.clone(); chromeFlat.flatShading = true;
const satin = chrome.clone(); satin.roughness = .22;

// push the vertices of a geometry around with a function, then smooth the normals
function shape(geo, fn) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); fn(v); p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals();
  return geo;
}
const lathe = (fn, steps = 160) => {
  const pts = [];
  for (let i = 0; i <= steps; i++) { const t = i / steps; pts.push(new THREE.Vector2(Math.max(.001, fn(t)), -1.3 + 2.6 * t)); }
  return new THREE.LatheGeometry(pts, 160);
};

const TEMP_OBJECTS = [
  // 0 · knot
  () => new THREE.Mesh(new THREE.TorusKnotGeometry(1, .3, 320, 48, 2, 3), chrome),
  // 1 · twisted bar
  () => new THREE.Mesh(shape(new THREE.BoxGeometry(1.1, 2.8, 1.1, 20, 120, 20), v => {
    const a = v.y * 1.1, c = Math.cos(a), s = Math.sin(a);
    const x = v.x * c - v.z * s, z = v.x * s + v.z * c; v.x = x; v.z = z;
  }), chrome),
  // 2 · heavy ring
  () => { const m = new THREE.Mesh(new THREE.TorusGeometry(1, .42, 96, 192), chrome); m.scale.z = .72; return m; },
  // 3 · vertebra column
  () => new THREE.Mesh(lathe(t => .32 + .3 * Math.pow(Math.abs(Math.sin(t * Math.PI * 4)), .6) * Math.sin(t * Math.PI)), chrome),
  // 4 · faceted gem
  () => new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 0), chromeFlat),
  // 5 · spiked seed
  () => new THREE.Mesh(shape(new THREE.SphereGeometry(1, 220, 160), v => {
    const n = v.clone().normalize();
    const k = Math.pow(Math.abs(Math.sin(4 * n.x) * Math.sin(4 * n.y + .6) * Math.sin(4 * n.z + 1.1)), .7);
    v.copy(n).multiplyScalar(1 + .45 * k);
  }), satin),
  // 6 · linked chain
  () => {
    const g = new THREE.Group(), geo = new THREE.TorusGeometry(.62, .17, 48, 128);
    for (let i = 0; i < 3; i++) {
      const m = new THREE.Mesh(geo, chrome);
      m.position.y = (i - 1) * .92;
      m.rotation.y = i % 2 ? Math.PI / 2 : 0;
      m.scale.y = 1.25;
      g.add(m);
    }
    return g;
  },
  // 7 · vessel
  () => new THREE.Mesh(lathe(t => .28 + .62 * Math.sin(Math.PI * Math.pow(t, .8)) * (1 - .25 * t) + (t > .9 ? (t - .9) * 2.2 : 0)), satin),
];

let gltfLoader = null;
async function loadModel(url) {
  if (!gltfLoader) { const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'); gltfLoader = new GLTFLoader(); }
  const gltf = await gltfLoader.loadAsync(url);
  gltf.scene.traverse(m => { if (m.isMesh) m.material = chrome; });   // same chrome look as the page
  return gltf.scene;
}

// centre and size an object for the 4:5 frame; the pivot is what turns
function framed(obj, k) {
  const wrap = new THREE.Group(), pivot = new THREE.Group(), tilt = new THREE.Group();
  tilt.add(obj); pivot.add(tilt); wrap.add(pivot);
  tilt.rotation.set(.3 + (k % 3) * .22, 0, (k % 2 ? -.18 : .12));   // each slot leans a little differently
  // size from the bounding sphere so it never leaves the frame while it turns
  const sphere = new THREE.Box3().setFromObject(tilt).getBoundingSphere(new THREE.Sphere());
  tilt.position.sub(sphere.center);
  const visH = 2 * snapCam.position.z * Math.tan(THREE.MathUtils.degToRad(snapCam.fov / 2)), visW = visH * snapCam.aspect;
  wrap.scale.setScalar(Math.min(visW, visH) * .36 / sphere.radius);
  return { wrap, pivot, spin0: k * .85 };
}

const slotCache = new Map();
function slotObject(it, k) {
  if (!slotCache.has(k)) slotCache.set(k, (async () => {
    let obj = null;
    if (it.model) {
      try { obj = await loadModel(it.model); }
      catch (e) { console.warn(`could not load ${it.model} — using a temporary object`, e); }
    }
    return framed(obj || TEMP_OBJECTS[k % TEMP_OBJECTS.length](), k);
  })());
  return slotCache.get(k);
}

/* strip thumbnails: a still render of each slot's object */
function snapshot(slot, k) {
  slot.pivot.rotation.y = slot.spin0;
  slot.pivot.position.y = 0;
  snapScene.add(slot.wrap);
  snapScene.environmentRotation.y = k * .7;
  snapRenderer.render(snapScene, snapCam);
  const url = snapRenderer.domElement.toDataURL('image/png');
  snapScene.remove(slot.wrap);
  return { url, ar: `${SNAP_W} / ${SNAP_H}` };
}

/* the hovered / open work: its object takes the first object's place in the main view (white background),
   so it follows the mouse, turns by drag, zooms with the wheel and drops a water drop on click — no auto-turning */
function toSubject(obj) {
  obj.updateMatrixWorld(true);
  const geos = [];
  obj.traverse(m => {
    if (!m.isMesh) return;
    const g = m.geometry.clone();
    g.applyMatrix4(m.matrixWorld);
    Object.keys(g.attributes).forEach(n => { if (n !== 'position' && n !== 'normal') g.deleteAttribute(n); });
    if (!g.attributes.normal) g.computeVertexNormals();
    geos.push(g);
  });
  const box = new THREE.Box3();
  geos.forEach(g => { g.computeBoundingBox(); box.union(g.boundingBox); });
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const s = HERO_R * 2.0 / (sph.radius || 1);     // starts at the bigger, zoomed-in size
  const group = new THREE.Group();
  geos.forEach(g => {
    g.translate(-sph.center.x, -sph.center.y, -sph.center.z);
    g.scale(s, s, s);
    g.computeBoundingSphere();
    group.add(new THREE.Mesh(g, material));   // same chrome + water-drop material as the first object
  });
  return group;
}
const subjectCache = new Map();
function subjectFor(it, k) {
  if (!subjectCache.has(k)) subjectCache.set(k, (async () => {
    let obj = null;
    if (it.model) {
      try { obj = await loadModel(it.model); }
      catch (e) { console.warn(`could not load ${it.model} — using a temporary object`, e); }
    }
    return toSubject(obj || TEMP_OBJECTS[k % TEMP_OBJECTS.length]());
  })());
  return subjectCache.get(k);
}
function setSubject(obj) {
  if (obj === subject) return;
  holder.remove(subject);
  subject = obj;
  holder.add(obj);
  ripT = -1;
  dropT.fill(-1);
  // (no size pop on arrival — works keep the same size while switching)
}
let subjectToken = 0, lastWorkK = null, prefetchTimer = 0;
addEventListener('objectwork', async e => {
  const d = e.detail;
  const my = ++subjectToken;
  if (!d) { slide = null; lastWorkK = null; setSubject(mesh); return; }
  // which way along the strip (shortest way round): +1 next, -1 previous
  let dir = 0;
  if (lastWorkK !== null && d.k !== lastWorkK) {
    const n = Math.max(1, PROJECT_COUNT()), diff = ((d.k - lastWorkK) % n + n) % n;
    dir = diff <= n / 2 ? 1 : -1;
  }
  lastWorkK = d.k;
  // build the neighbours' objects once this one has settled, so the next swipe doesn't stutter
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(() => {
    const items = window.__stripItems, n = items ? items.length : 0;
    if (!n) return;
    [1, -1].forEach(o => { const j = ((d.k + o) % n + n) % n; subjectFor(items[j], j); });
  }, (SLIDE_DUR + .15) * 1000);
  const obj = await subjectFor(d.it, d.k);
  if (my !== subjectToken) return;
  if (!dir || reduceMotion3D || subject === mesh) { slide = null; setSubject(obj); return; }
  if (slide && !slide.swapped) { slide.obj = obj; slide.dir = dir; }   // still leaving: just change where it goes
  else {
    slide = { t: 0, dir, obj, swapped: false };
    // continuing a swipe that already moved the object the right way → start the slide from there
    if (swipeDX && Math.sign(swipeDX) === -dir) {
      const wpp = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z / innerHeight;
      slide.fromX = swipeDX * wpp;
    } else { swipeDX = 0; swipeHold = 0; }
  }
});

window.setObjectSnap && window.setObjectSnap(async (it, k) => snapshot(await slotObject(it, k), k));
}   // end of the 3D-only part
</script>

<!-- ======================= Product: 2D cut-out photo in the middle instead of the 3D object ======================= -->
<script>
if (IS_PRODUCT) (() => {
  const veil = document.getElementById('veil');
  veil.style.transition = 'opacity .6s ease';
  requestAnimationFrame(() => { veil.style.opacity = '0'; });
  setTimeout(() => {
    veil.style.display = 'none';
    window.__objectIntroDone = true;
    dispatchEvent(new Event('objectintrodone'));
  }, 600);

  // two stacked images so one photo cross-fades into the next
  const wrap = document.createElement('div');
  wrap.className = 'product-stage';
  wrap.innerHTML = '<img alt=""><img alt="">';
  document.getElementById('app').appendChild(wrap);
  const imgs = [...wrap.querySelectorAll('img')];
  let front = 0, shownSrc = '';
  // dir: +1 = moving to the next work (new photo slides in from the right), -1 = previous, 0 = just fade
  // Product keeps a plain cross-fade in place (the sliding carousel felt too busy here); size = per-product scale
  function show(src, dir = 0, size = 1) {
    if (!src || src === shownSrc) return;
    shownSrc = src;
    const next = imgs[1 - front], prev = imgs[front];
    next.style.transition = 'none';
    next.style.setProperty('--size', size);
    void next.offsetWidth;
    next.style.transition = '';
    next.onload = () => { next.classList.add('on'); prev.classList.remove('on'); front = 1 - front; };
    next.src = src;
  }
  // the first product's cut-out is shown until a work is picked
  const first = PROJECTS.find(p => p.cutouts.length);
  const home = first ? first.cutouts[0] : '';
  show(home, 0, first ? first.size : 1);
  // which product is on show → clicking the photo opens its detail page
  let curProject = first ? PROJECTS.indexOf(first) : 0;
  let lastK = null;
  addEventListener('objectwork', e => {
    const d = e.detail;
    // direction of travel along the strip (shortest way round)
    let dir = 0;
    if (d && lastK !== null && d.k !== lastK) {
      const n = Math.max(1, PROJECTS.length), diff = ((d.k - lastK) % n + n) % n;
      dir = diff <= n / 2 ? 1 : -1;
    }
    if (d) lastK = d.k;
    show(d ? d.it.cutout : home, dir, d ? d.it.size : (first ? first.size : 1));
    curProject = d ? d.it.project : (first ? PROJECTS.indexOf(first) : 0);
  });
  imgs.forEach(im => im.addEventListener('click', () => { if (PROJECTS.length) location.href = caseUrl(curProject); }));

  // "View details →" follows the cursor while it is over the photo
  const tag = document.createElement('div');
  tag.className = 'spin-tag'; tag.textContent = 'View details →';
  document.body.appendChild(tag);
  imgs.forEach(im => {
    im.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      tag.style.left = e.clientX + 'px'; tag.style.top = e.clientY + 'px';
      tag.classList.toggle('left', e.clientX > innerWidth - 160);
      tag.classList.add('on');
    });
    im.addEventListener('pointerleave', () => tag.classList.remove('on'));
  });
  if (!PROJECTS.length) wrap.insertAdjacentHTML('beforeend', '<p class="product-empty muted">Coming soon</p>');

  // phones: swipe sideways anywhere above the strip → next / previous product
  let sw = null;
  addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || e.target.closest('.m-strip, a, button, .site-top')) return;
    sw = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    sw = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3)
      dispatchEvent(new CustomEvent('objectswipe', { detail: dx < 0 ? 1 : -1 }));
  });
})();
</script>

<!-- ======================= strip, artwork, text ======================= -->
<script>
(() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- items ---------- */
  // at least 8 slots in the strip, one object each. Projects are dealt out in turn
  // (5 projects → the first 3 get a second slot); with more than 8 projects every project still gets one.
  // Product: one slot per product (no repeats)
  const SLOTS = !PROJECTS.length ? 0 : IS_PRODUCT ? PROJECTS.length : Math.max(8, PROJECTS.length);
  const perProject = PROJECTS.map((p, pi) => Math.floor(SLOTS / PROJECTS.length) + (pi < SLOTS % PROJECTS.length ? 1 : 0));
  const ITEMS = [];
  for (let s = 0; s < SLOTS && PROJECTS.length; s++) {
    const pi = s % PROJECTS.length, p = PROJECTS[pi], ii = Math.floor(s / PROJECTS.length);
    ITEMS.push({
      title: p.title, info: p.info, project: pi, idx: ii + 1, total: perProject[pi], src: '', model: p.models[ii] || '',
      cutout: p.cutouts.length ? p.cutouts[ii % p.cutouts.length] : '', size: p.size,
      letter: String.fromCharCode(65 + pi), num: String(s + 1).padStart(2, '0'), k: s,
    });
  }
  // the strip thumb(s) of the work on show stay at full strength, the rest are faded
  const markCurrent = k => document.querySelectorAll('.carousel .thumb').forEach(t => t.classList.toggle('is-current', k != null && +t.dataset.i === k));
  const liveWork = it => { markCurrent(it ? it.k : null); dispatchEvent(new CustomEvent('objectwork', { detail: it ? { it, k: it.k } : null })); };
  const label = it => `${it.title} ${it.idx}/${it.total}`;
  const workCase = document.getElementById('workCase');
  const workInfo = document.getElementById('workInfo');
  const setCase = it => { workCase.href = caseUrl(it.project); workInfo.textContent = it.info; };
  const detailUrl = it => caseUrl(it.project);

  const ARS = ['4 / 5', '1 / 1', '3 / 2', '4 / 5', '2 / 3'];
  function placeholder(it, k) {
    const ar = ARS[(it.project + it.idx) % ARS.length];
    const [aw, ah] = ar.split('/').map(Number);
    const h = 1000, w = Math.round(h * aw / ah);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const tone = 214 + (it.project * 9 + it.idx * 5) % 30;
    g.fillStyle = `rgb(${tone},${tone},${tone})`; g.fillRect(0, 0, w, h);
    const cx = w * (.4 + (it.idx % 3) * .1), cy = h * .5, r = Math.min(w, h) * (.18 + (it.project % 4) * .035);
    g.fillStyle = 'rgba(0,0,0,.09)'; g.beginPath(); g.ellipse(cx + r * .2, cy + r * 1.08, r * 1.1, r * .2, 0, 0, Math.PI * 2); g.fill();
    const sh = g.createRadialGradient(cx - r * .35, cy - r * .4, r * .08, cx, cy, r * 1.15);
    sh.addColorStop(0, '#fafafa'); sh.addColorStop(.55, '#b9b9b9'); sh.addColorStop(1, '#5f5f5f');
    g.fillStyle = sh; g.beginPath();
    const form = (it.project + it.idx) % 3;
    if (form === 0) g.arc(cx, cy, r, 0, Math.PI * 2);
    else if (form === 1 && g.roundRect) g.roundRect(cx - r, cy - r, r * 2, r * 2, r * .35);
    else { g.arc(cx, cy, r, 0, Math.PI * 2); g.arc(cx, cy, r * .45, 0, Math.PI * 2, true); }
    g.fill('evenodd');
    return { url: c.toDataURL('image/jpeg', .85), ar };
  }
  // every slot is a 3D object render; if the 3D library can't load, a flat stand-in is drawn instead
  function load(it, k) {
    // Product: the strip shows the cut-out photo itself
    if (IS_PRODUCT) return new Promise(res => {
      if (!it.cutout) return res(placeholder(it, k));
      const im = new Image();
      im.onload = () => res({ url: it.cutout, ar: `${im.naturalWidth} / ${im.naturalHeight}` });
      im.onerror = () => res(placeholder(it, k));
      im.src = it.cutout;
    });
    // no time limit: the strip already shows a stand-in, and the real 3D render replaces it whenever it is ready
    // (a slow phone or a big .glb used to be cut off after 8 s and stay grey)
    return objectSnap.then(snap => snap(it, k))
      .then(r => r || null)
      .catch(() => null);
  }

  const carousel = document.getElementById('carousel');
  const playCarousel = document.getElementById('playCarousel');
  const workName = document.getElementById('workName');
  const QT = 40, SPEED_S = 1.5, N = ITEMS.length, STRIP = N * QT, SPEED = QT / SPEED_S, EDGE = 24;
  window.__stripN = N;
  window.__stripItems = ITEMS;      // the 3D view prepares the neighbouring works' objects ahead of time

  function makeThumb(it, i, first) {
    const t = document.createElement('div');
    t.className = 'thumb preview';
    t.dataset.i = i;
    t.innerHTML = `<img alt="" src="${it.url}">${first ? '<span class="tile-work">Work</span>' : ''}<span class="tile-letter">${it.letter}</span><span class="tile-num">${it.num}</span>`;
    return t;
  }

  /* ---------- big artwork (two layers for cross-fades) ---------- */
  const bgA = document.getElementById('workBg'), bgB = bgA.cloneNode(false);
  bgB.id = 'workBgB'; bgA.after(bgB);
  const layers = [bgA, bgB];
  let front = 0, token = 0, shown = false;
  function paint(url, ar, tk, crossfade) {
    const go = () => {
      if (tk !== token) return;
      const el = crossfade ? layers[1 - front] : layers[front];
      const first = !shown; shown = true;
      if (ar) el.style.setProperty('--work-ar', ar);
      el.style.backgroundImage = `url("${url}")`;
      el.dataset.cur = url;
      el.classList.remove('leaving', 'entering');
      if (first) { void el.offsetWidth; el.classList.add('entering'); }
      el.classList.add('show');
      if (crossfade) { layers[front].classList.remove('show'); front = 1 - front; }
    };
    const im = new Image(); im.src = url;
    (im.decode ? im.decode() : Promise.reject()).then(go).catch(go);
  }
  function openWork(it) {
    workName.textContent = label(it); setCase(it);
    document.body.classList.add('work-open');
    liveWork(it);
    const el = layers[front];
    if (!(el.dataset.cur === it.url && el.classList.contains('show'))) paint(it.url, it.ar, ++token, false);
  }
  function closeWork() {
    ++token; shown = false;
    liveWork(null);
    layers.forEach(l => { l.classList.remove('show', 'entering'); l.classList.add('leaving'); });
    document.body.classList.remove('work-open');
  }

  /* ---------- drum projection (items squeeze toward the edges) ---------- */
  const CURVE = 1.5;
  let cache = { vc: -1 };
  function curveFor(vc) {
    if (cache.vc === vc) return cache;
    // Product: the strip only spans about 7 works each side of the centre (35 at once was too busy)
    const half = Math.min(vc - EDGE, IS_PRODUCT ? 7 * QT : Infinity), sinA = Math.sin(CURVE);
    const r = Math.max(.05, CURVE * Math.cos(CURVE) / sinA);
    return (cache = { vc, half, sinA, fit: half / (half + QT / 2 * r) });
  }
  function project(el, x, cx, cut) {
    const { half, sinA, fit } = curveFor(cx);
    let o = (x - cx) / half; o = Math.max(-1, Math.min(1, o));
    const g = o * CURVE;
    const dx = fit * half * Math.sin(g) / sinA - o * half;
    const sx = Math.max(.05, fit * CURVE * Math.cos(g) / sinA);
    let a = Math.min(1, (1 - Math.abs(o)) / .12);
    if (cut != null && x < cut) a *= Math.max(0, 1 - (cut - x) / QT);
    el.style.opacity = a < 1 ? a.toFixed(3) : '1';
    el.style.transform = `translate(${dx.toFixed(1)}px, 0) scaleX(${sx.toFixed(3)})`;
    const inv = `scaleX(${(1 / (fit * CURVE / sinA)).toFixed(4)})`;
    for (let i = 0; i < el.children.length; i++) el.children[i].style.transform = inv;
  }
  function layoutAll(els, posOf, cut) {
    const cx = innerWidth / 2, W = innerWidth, { half } = curveFor(cx);
    for (let s = 0; s < els.length; s++) {
      const x = posOf(s);
      if (x >= EDGE && x <= W - EDGE && Math.abs(x - cx) <= half) project(els[s], x, cx, cut);
      else if (els[s].style.transform !== 'scaleX(0)') els[s].style.transform = 'scaleX(0)';
    }
  }

  /* ---------- play mode (endless strip under the red playhead) ---------- */
  let thumbs = [], playing = false, B = 0, cut = null, current = -1, hovered = null;
  let dragging = false, dragX = 0, dragB = 0, sy = 1, syTarget = 1, raf = 0, lastT = 0, morphing = false;
  let glideTo = null, downX = 0, downEl = null;   // click on a strip thumb → glide there
  let copies = 1, offset = 0, cloned = false;
  const mod = (a, n) => ((a % n) + n) % n;
  let centre = innerWidth / 2;
  addEventListener('resize', () => { centre = innerWidth / 2; });

  function buildClones() {
    if (cloned || !N) return; cloned = true;   // no works (empty Product page): nothing to clone
    copies = Math.max(1, Math.ceil((screen.width || 1920) / STRIP));
    offset = copies * STRIP;
    for (let c = 0; c < 2 * copies + 1; c++) thumbs.forEach(t => {
      const k = t.cloneNode(true); k.classList.add('clone'); k.setAttribute('aria-hidden', 'true'); playCarousel.appendChild(k);
    });
  }
  function layoutPlay() {
    if (!N) return;
    playCarousel.style.transform = `translate3d(${centre - 20 - offset - mod(B, STRIP)}px, 0, 0) scaleY(${sy.toFixed(4)})`;
    if (document.body.classList.contains('idle')) return;
    const x0 = centre - offset - mod(B, STRIP);
    layoutAll(playCarousel.children, s => x0 + s * QT, cut);
  }
  function show(i) {
    current = i;
    const it = ITEMS[i];
    document.body.classList.add('work-open');
    workName.textContent = label(it); setCase(it);
    liveWork(it);
    const el = layers[front];
    const visibleNow = el.classList.contains('show');
    if (!(el.dataset.cur === it.url && visibleNow)) paint(it.url, it.ar, ++token, visibleNow);
  }
  function checkCurrent() {
    const i = mod(Math.round(B / QT), N);
    if (i !== current) show(i);
  }
  function loop(t) {
    if (!playing) { raf = 0; return; }
    const dt = lastT ? Math.max(0, Math.min((t - lastT) / 1000, .05)) : 0;
    lastT = t;
    sy += (syTarget - sy) * (1 - Math.exp(-dt * 12));
    // the strip stays still on the open work; it only moves when the viewer drags it or uses the arrow keys.
    // After a drag it settles gently on the nearest work.
    if (!dragging && !morphing) {
      const snap = glideTo !== null ? glideTo : Math.round(B / QT) * QT;
      B += (snap - B) * (reduceMotion ? 1 : 1 - Math.exp(-dt * (glideTo !== null ? 7 : 10)));
      if (Math.abs(snap - B) < .05) { B = snap; glideTo = null; }
    }
    if (!morphing && glideTo === null) checkCurrent();
    layoutPlay();
    raf = requestAnimationFrame(loop);
  }

  let idleTimer = 0;
  const armIdle = () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 5000);
  };
  const wake = () => { if (!playing) return; document.body.classList.remove('idle'); armIdle(); };

  function startPlay() {
    if (playing || !N) return;
    playing = true;
    buildClones();
    layers.forEach(l => l.classList.remove('leaving'));
    centre = innerWidth / 2;
    const i = hovered ? +hovered.dataset.i : 0;
    B = 0; cut = centre; current = -1;
    document.body.classList.add('morphing', 'playing');
    layoutPlay();
    show(i);
    armIdle();
    const target = i * QT, start = performance.now();
    morphing = true;
    const step = () => {
      if (!playing) return;
      const k = Math.max(0, Math.min(1, (performance.now() - start) / 1000));
      const e = 1 - Math.pow(1 - k, 3);
      B = target * e;
      cut = centre * (1 - e);
      layoutPlay();
      if (k < 1) { requestAnimationFrame(step); return; }
      cut = null; morphing = false;
      document.body.classList.remove('morphing');
      lastT = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    };
    requestAnimationFrame(step);
  }
  function stopPlay() {
    if (!playing) return;
    playing = false; dragging = false; morphing = false; cut = null; glideTo = null;
    cancelAnimationFrame(raf); raf = 0;
    clearTimeout(idleTimer);
    document.body.classList.remove('playing', 'idle', 'dragging', 'morphing', 'work-open');
    ++token; shown = false;
    liveWork(null);
    layers.forEach(l => { l.classList.remove('show', 'leaving', 'entering'); l.style.backgroundImage = ''; l.dataset.cur = ''; });
    setTimeout(() => { if (!playing) { sy = syTarget = 1; B = 0; layoutPlay(); workName.textContent = ''; } }, 900);
  }

  carousel.addEventListener('click', () => { if (!playing) startPlay(); });
  carousel.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startPlay(); } });
  const closeBtn = document.getElementById('minimise');
  closeBtn.addEventListener('click', stopPlay);
  closeBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stopPlay(); } });
  addEventListener('keydown', e => {
    if (!playing) return;
    if (e.key === 'Escape') stopPlay();
    if (e.key === 'ArrowRight') { glideTo = null; B = (Math.round(B / QT) + 1) * QT; wake(); }
    if (e.key === 'ArrowLeft') { glideTo = null; B = (Math.round(B / QT) - 1) * QT; wake(); }
  });

  // stepping along the strip (Product arrows, the wheel on both pages)
  if (N > 1) {
    const step = dir => {
      if (getComputedStyle(carousel).display === 'none') {          // phones: same as a swipe
        dispatchEvent(new CustomEvent('objectswipe', { detail: dir }));
        return;
      }
      if (!playing) {                                                // first press: open the next / last product
        hovered = thumbs[dir > 0 ? 1 : N - 1];
        startPlay(); hovered = null;
        return;
      }
      if (morphing) return;
      // glide (not jump) one work along; repeated steps add up from where the glide is heading
      const base = glideTo !== null ? glideTo : Math.round(B / QT) * QT;
      glideTo = base + dir * QT;
      show(mod(Math.round(glideTo / QT), N));
      lastT = 0; wake();
    };
    // Product: a short arrow either side of the photo
    if (IS_PRODUCT) [['prev', -1, 'Previous product', 'M13 5H1M5 1L1 5l4 4'], ['next', 1, 'Next product', 'M1 5h12M9 1l4 4-4 4']].forEach(([cls, dir, lbl, d]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = `p-nav p-nav-${cls}`;
      b.setAttribute('aria-label', lbl);
      b.innerHTML = `<span class="p-dot"><svg width="20" height="14" viewBox="0 0 14 10" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></span>`;
      b.addEventListener('click', e => { e.stopPropagation(); step(dir); });
      document.body.appendChild(b);
    });
    // mouse wheel / trackpad: the strip follows the scroll — a slow notch moves one product,
    // a fast flick runs through several — then it glides and settles on the nearest product.
    const WHEEL_PX_PER_ITEM = 100;                                   // ≈ one mouse-wheel notch per product
    const STRIP_ZONE = 150;                                          // 3D: bottom band (px) where the wheel moves the strip
    let wheelPos = null, wheelIdle = 0, openLock = 0;
    addEventListener('wheel', e => {
      if (e.ctrlKey) return;                                         // pinch-zoom
      // 3D: only with the mouse down by the strip — elsewhere the wheel zooms the object
      if (!IS_PRODUCT && e.clientY < innerHeight - STRIP_ZONE) return;
      let d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (e.deltaMode === 1) d *= 33; else if (e.deltaMode === 2) d *= innerHeight;   // lines / pages → pixels
      if (!d) return;
      const now = performance.now();
      if (!playing || getComputedStyle(carousel).display === 'none') {   // first scroll opens the strip (or phones: swipe)
        if (now < openLock) return;
        step(d > 0 ? 1 : -1); openLock = now + 900;
        return;
      }
      if (morphing) return;
      clearTimeout(wheelIdle); wheelIdle = setTimeout(() => { wheelPos = null; }, 220);
      if (wheelPos === null) wheelPos = glideTo !== null ? glideTo : Math.round(B / QT) * QT;
      wheelPos += d / WHEEL_PX_PER_ITEM * QT;
      const target = Math.round(wheelPos / QT) * QT;
      if (target !== glideTo) {
        glideTo = target;
        show(mod(Math.round(target / QT), N));
      }
      lastT = 0; wake();
    }, { passive: true });
  }

  // hover the browsing strip → preview the artwork
  carousel.addEventListener('pointerover', e => {
    if (playing) return;
    const t = e.target.closest('.thumb'); if (!t) return;
    buildClones();
    hovered = t;
    openWork(ITEMS[+t.dataset.i]);
  });
  // leaving the strip keeps the work that was last previewed (moving up to turn / rub it used to drop back to the first object)
  carousel.addEventListener('pointerleave', () => { hovered = null; });

  // drag the play strip to scrub
  document.addEventListener('pointerdown', e => {
    if (!playing || !(e.target instanceof Element) || !e.target.closest('#playCarousel')) return;
    e.preventDefault();
    glideTo = null;
    dragging = true; document.body.classList.add('dragging');
    syTarget = .8; dragX = e.clientX; dragB = B;
    downX = e.clientX; downEl = e.target.closest('.thumb');
  });
  // a click (no real drag) on a thumb in the open strip → glide straight to that work
  addEventListener('pointerup', e => {
    if (!playing || !downEl || Math.abs(e.clientX - downX) > 5) { downEl = null; return; }
    const s = [...playCarousel.children].indexOf(downEl); downEl = null;
    if (s < 0) return;
    const x0 = centre - offset - mod(B, STRIP);                     // same maths as layoutPlay
    const steps = Math.round((x0 + s * QT - centre) / QT);
    if (!steps) return;
    B = dragB;                                                       // undo the tiny drag
    glideTo = (Math.round(B / QT) + steps) * QT;
    show(mod(Math.round(glideTo / QT), N));                          // open the target right away (no flicker through the ones between)
    lastT = 0; wake();
  });
  addEventListener('pointermove', e => {
    if (playing) wake();
    if (!dragging) return;
    B = dragB - (e.clientX - dragX);
    checkCurrent(); layoutPlay();
  });
  const endDrag = () => { if (!dragging) return; dragging = false; document.body.classList.remove('dragging'); syTarget = 1; lastT = 0; };
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);
  playCarousel.addEventListener('dragstart', e => e.preventDefault());


  function layoutBrowse() {
    if (document.body.classList.contains('intro-spinning')) return;
    const cx = innerWidth / 2;
    layoutAll(thumbs, s => cx + s * QT);
  }
  addEventListener('resize', layoutBrowse);

  // intro: the strip spins in from the right
  function spinIn() {
    const cx = innerWidth / 2, W = innerWidth;
    const set = off => {
      carousel.style.transform = `translateX(${-20 + off * QT}px)`;
      for (let c = 0; c < thumbs.length; c++) {
        const x = cx + (c + off) * QT;
        if (x >= EDGE && x <= W - EDGE) project(thumbs[c], x, cx);
        else if (thumbs[c].style.transform !== 'scaleX(0)') thumbs[c].style.transform = 'scaleX(0)';
      }
    };
    set(20);
    document.documentElement.classList.remove('intro-pending');
    document.body.classList.add('intro-spinning');
    const start = performance.now();
    const step = () => {
      const k = Math.max(0, Math.min(1, (performance.now() - start) / 1200));
      set(20 * Math.pow(1 - k, 3));
      if (k < 1) { requestAnimationFrame(step); return; }
      carousel.style.transform = '';
      document.body.classList.remove('intro-spinning');
      layoutBrowse();
    };
    requestAnimationFrame(step);
  }

  /* ---------- phones: swipe the strip sideways → the object in the middle of the strip is shown ----------
     The first cell is the first (pebble) object; then one cell per work, like the strip on a computer. */
  function buildMobile() {
    const strip = document.getElementById('mStrip');
    const mName = document.getElementById('mName'), mInfo = document.getElementById('mInfo');
    mName.textContent = CAT_LABEL;
    if (!N) mInfo.textContent = 'Coming soon';
    const cells = [];
    const hero = document.createElement('button');
    hero.type = 'button'; hero.className = 'm-cell hero is-current'; hero.textContent = '○';
    hero.setAttribute('aria-label', 'First object');
    strip.appendChild(hero); cells.push(hero);
    ITEMS.forEach((it, k) => {
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'm-cell'; c.dataset.i = k;   // its picture is swapped in when the 3D render is ready
      c.style.backgroundImage = `url("${it.url}")`;
      c.setAttribute('aria-label', label(it));
      strip.appendChild(c); cells.push(c);
    });
    let cur = 0;
    function select(i) {
      if (i === cur) return;
      cells[cur].classList.remove('is-current');
      cur = i;
      cells[i].classList.add('is-current');
      if (i === 0) {
        liveWork(null);
        mName.textContent = CAT_LABEL; mInfo.textContent = N ? 'Swipe to see each object' : 'Coming soon';
      } else {
        const it = ITEMS[i - 1];
        liveWork(it);
        mName.innerHTML = `<a href="${caseUrl(it.project)}">${label(it)}</a>`;
        mInfo.innerHTML = `${it.info || ''} · <a href="${caseUrl(it.project)}">View Case →</a>`;
      }
    }
    // while swiping, whichever cell sits on the middle mark is shown right away
    let raf = 0;
    strip.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const mid = strip.scrollLeft + strip.clientWidth / 2;
        let best = 0, bd = Infinity;
        cells.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
        select(best);
      });
    }, { passive: true });
    // tapping a cell brings it to the middle
    const centre = c => strip.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - strip.clientWidth / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
    cells.forEach(c => c.addEventListener('click', () => centre(c)));
    // a sideways swipe on the empty screen steps one object along the strip
    addEventListener('objectswipe', e => {
      const i = Math.max(0, Math.min(cells.length - 1, cur + e.detail));
      if (i !== cur) centre(cells[i]);
    });
  }

  /* ---------- boot ----------
     The strip is drawn straight away (3D: grey stand-ins, Product: the photos), and each slot's
     3D render is swapped in as soon as it is ready — so the strip never waits for all of them. */
  ITEMS.forEach((it, k) => {
    if (IS_PRODUCT) { it.url = it.cutout || placeholder(it, k).url; it.ar = '4 / 5'; }
    else { const p = placeholder(it, k); it.url = p.url; it.ar = p.ar; }
  });
  ITEMS.forEach((it, k) => load(it, k).then(r => {
    if (!r) return;
    it.url = r.url; it.ar = r.ar;
    document.querySelectorAll(`.carousel .thumb[data-i="${k}"] img`).forEach(im => { im.src = r.url; });
    const cell = document.querySelector(`.m-cell[data-i="${k}"]`);
    if (cell) cell.style.backgroundImage = `url("${r.url}")`;
  }));
  Promise.resolve().then(() => {
    ITEMS.forEach((it, i) => { const t = makeThumb(it, i, i === 0); carousel.appendChild(t); thumbs.push(t); });
    if (IS_PRODUCT && !document.querySelector('.carousel .thumb.is-current')) markCurrent(0);   // the first product is on show
    buildMobile();
    layoutBrowse();
    let started = false;
    const go = () => {
      if (started) return; started = true;
      if (getComputedStyle(carousel).display === 'none' || reduceMotion) {
        document.documentElement.classList.remove('intro-pending'); layoutBrowse(); return;
      }
      spinIn();
    };
    if (window.__objectIntroDone) go(); else addEventListener('objectintrodone', go, { once: true });
    setTimeout(() => {               // in case the 3D library could not load
      const veil = document.getElementById('veil');
      if (veil && !window.__objectIntroDone) veil.style.display = 'none';
      go();
    }, 4000);
  });

  /* ---------- left-middle: Seoul clock + count (Metal Craft layout) ---------- */
  document.getElementById('idleCount').textContent = PROJECTS.length ? `${CAT_LABEL} — ${PROJECTS.length} project${PROJECTS.length === 1 ? '' : 's'}` : `${CAT_LABEL} — coming soon`;
  const clockEl = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const tickClock = () => { clockEl.textContent = `${fmt.format(new Date())}, Seoul`; };
  tickClock(); setInterval(tickClock, 1000);
})();
</script>
<script src="../site-cursor.js"></script>
</body>
</html>
