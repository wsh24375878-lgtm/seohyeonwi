<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#050505;font-family:Arial,Helvetica,sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
.page{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#fff}

/* ---------- title (same as main page) ---------- */
.text{position:absolute;left:24px;top:54px;width:min(65vw,1080px);margin:0;font-size:clamp(26px,3.25vw,56px);line-height:1.05;font-weight:400;letter-spacing:-.04em;color:#050505;z-index:3}
.letter{display:inline-block;position:relative;will-change:transform;white-space:pre}
.word{display:inline-block;white-space:nowrap}

/* ---------- gallery ---------- */
/* card sizes after hirotos.com/projects: a strip of cropped cards in three shapes repeating every 8 —
   landscape (1,3,7), portrait (2,4,6,8) and wide (5), centred on one line. Sizes scale with the screen
   and stop at a minimum on phones. */
.page{--card-tall:max(196px,min(18.2vw,calc(205.4px + 6.37vw)))}
.gallery{position:absolute;left:0;right:0;top:calc(50% - var(--card-tall) / 2 - 20px);height:calc(var(--card-tall) + 40px);overflow:hidden;z-index:4}
.track{position:absolute;left:-90px;top:20px;height:var(--card-tall);display:flex;align-items:center;gap:clamp(14px,2.1vw,32px);width:max-content;will-change:transform}
.card{flex:0 0 auto;position:relative;overflow:hidden;background:#ebebeb;
  width:max(220px,min(21vw,calc(239.2px + 7.35vw)));height:max(154px,min(14.9vw,calc(167.7px + 5.215vw)))}
.card:nth-child(3n+2) .art{background:#e4e4e4}
.card:nth-child(3n) .art{background:#f0f0f0}
.card-label{position:absolute;left:14px;bottom:12px;font-size:15px;line-height:1;color:#8c8c8c;opacity:0;transform:translateY(4px);transition:opacity .3s ease,transform .3s ease}
.card:hover .card-label{opacity:1;transform:none}
.card[data-slot="2"],.card[data-slot="4"],.card[data-slot="6"],.card[data-slot="8"]{width:max(154px,min(13.8vw,calc(158.6px + 4.83vw)));height:var(--card-tall)}
.card[data-slot="5"]{width:max(254px,min(24vw,calc(271.7px + 8.4vw)));height:max(150px,min(14vw,calc(159.9px + 4.9vw)))}
/* no cropping: each card keeps the height of its slot in the pattern above, and its width follows the poster's own ratio */
.track .card{width:auto!important;aspect-ratio:var(--ar,.75)}
.art{width:100%;height:100%;background:#ebebeb;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.card:hover .art{transform:scale(1.055)}
.art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;-webkit-user-drag:none}
.card-label{z-index:1;background:#fff;padding:3px 5px}
.card[data-slot="1"]{animation:floatA 6.6s ease-in-out infinite}
.card[data-slot="2"]{animation:floatB 7.4s ease-in-out infinite}
.card[data-slot="3"]{animation:floatC 6.9s ease-in-out infinite}
.card[data-slot="4"]{animation:floatD 7.8s ease-in-out infinite}
.card[data-slot="5"]{animation:floatE 6.3s ease-in-out infinite}
.card[data-slot="6"]{animation:floatF 7.1s ease-in-out infinite}
.card[data-slot="7"]{animation:floatG 6.8s ease-in-out infinite}
.card[data-slot="8"]{animation:floatH 7.5s ease-in-out infinite}
@keyframes floatA{50%{translate:0 7px}}@keyframes floatB{50%{translate:0 -8px}}@keyframes floatC{50%{translate:0 6px}}@keyframes floatD{50%{translate:0 -7px}}@keyframes floatE{50%{translate:0 8px}}@keyframes floatF{50%{translate:0 -6px}}@keyframes floatG{50%{translate:0 7px}}@keyframes floatH{50%{translate:0 -8px}}

/* ---------- speed zones ---------- */
.speed-zone{position:absolute;z-index:30;top:calc(50% - var(--card-tall) / 2 - 20px);right:0;width:140px;height:calc(var(--card-tall) + 40px);cursor:e-resize}
.speed-zone.left{right:auto;left:0;cursor:w-resize;z-index:15}
.speed-hint{position:absolute;top:50%;right:23px;font-size:15px;color:#8c8c8c;opacity:0;transform:translateX(5px);transition:opacity .25s ease,transform .25s ease}
.speed-hint.left-hint{right:auto;left:23px;transform:translateX(-5px)}
.speed-zone.active .speed-hint{opacity:1;transform:translateX(0)}

@media (max-width:900px){.speed-zone{width:90px}}
@media (max-width:700px){
.text{left:14px;top:64px;width:88vw;font-size:clamp(20px,5vw,34px)}
/* phones: the cards keep their minimum sizes (220×154 / 154×196 / 254×150) with a 14px gap */
.gallery{touch-action:none}
.track{left:-60px}
.card-label{font-size:11px;left:8px;bottom:8px}
/* the finger drags the strip directly, so the edge speed zones are turned off */
.speed-zone{display:none}
}
</style>

<div class="page">
  <section class="gallery">
    <div class="track" id="track"></div>
  </section>

  <div class="speed-zone left" id="speedZoneLeft" aria-label="Reverse gallery"><div class="speed-hint left-hint">←</div></div>
  <div class="speed-zone" id="speedZone" aria-label="Speed up gallery"><div class="speed-hint">→</div></div>
</div>

<script src="works-data.js"></script>
<script>
/* ---------- cards: only the posters (design originals) from works-data.js — no styled shots or detail cuts.
   Every poster is one card; the set repeats so the strip never runs out. ---------- */
const GRAPHIC = window.OTHER_WORKS.graphic;
const POSTERS = [];
GRAPHIC.forEach((work, k) => (work.posters || []).filter(Boolean).forEach(src => POSTERS.push({ work, k, src })));
const track = document.getElementById('track');
// whole sets only (at least 3, about 32 cards), so the strip can loop seamlessly by exactly one set
const SETS = POSTERS.length ? Math.max(3, Math.ceil(32 / POSTERS.length)) : 0;
for (let i = 0; POSTERS.length && i < POSTERS.length * SETS; i++) {
  const { work, k, src } = POSTERS[i % POSTERS.length];
  const slot = (i % POSTERS.length) % 8 + 1;   // size / float slot follows the poster, so every set looks the same
  const card = document.createElement('a');
  card.className = 'card';
  card.dataset.slot = slot;
  card.href = `project-detail.html?project=${String(k + 1).padStart(2, '0')}&category=graphic`;
  card.setAttribute('aria-label', `View ${work.title}`);
  card.innerHTML = `<div class="art"><img src="${src}" alt=""></div><span class="card-label">${work.title}</span>`;
  const img = card.querySelector('img');
  const fit = () => img.naturalWidth && card.style.setProperty('--ar', img.naturalWidth / img.naturalHeight);
  img.complete ? fit() : img.addEventListener('load', fit);
  track.appendChild(card);
}

/* ---------- gallery motion ---------- */
const zone = document.getElementById('speedZone');
const zoneLeft = document.getElementById('speedZoneLeft');
const baseSpeed = .18, hoverSpeed = baseSpeed * 25;
let position = -90, currentSpeed = baseSpeed, targetSpeed = baseSpeed, last = performance.now();

// the closer the mouse gets to the very edge, the faster the cards run (a touch faster than before at the edge)
const EDGE_MAX = 1.2;              // top speed at the edge, relative to the old hover speed
function bindZone(el, speed) {
  const isLeft = speed < 0;
  const at = e => {
    const r = el.getBoundingClientRect();
    const fromEdge = isLeft ? e.clientX - r.left : r.right - e.clientX;   // 0 at the very edge
    const closeness = Math.max(0, Math.min(1, 1 - fromEdge / r.width));   // 0 … 1
    targetSpeed = speed * (.35 + (EDGE_MAX - .35) * Math.pow(closeness, 1.4));
  };
  const on = e => { el.classList.add('active'); if (e && e.clientX !== undefined) at(e); else targetSpeed = speed; };
  const off = () => { targetSpeed = baseSpeed; el.classList.remove('active'); };
  el.addEventListener('mouseenter', on);
  el.addEventListener('mousemove', at);
  el.addEventListener('mouseleave', off);
  el.addEventListener('touchstart', () => on(), { passive: true });
  el.addEventListener('touchend', off, { passive: true });
}
bindZone(zone, hoverSpeed);
bindZone(zoneLeft, -hoverSpeed);

// mouse wheel / trackpad: the cards slide sideways as fast as you scroll, then ease back to the slow drift
const WHEEL_PUSH = .06;            // speed added per px of scroll
const WHEEL_MAX = 70;              // fastest the wheel can push (px per frame)
let wheelSpeed = 0;
addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  // scroll down / right → cards move left, scroll up / left → cards move right
  wheelSpeed = Math.max(-WHEEL_MAX, Math.min(WHEEL_MAX, wheelSpeed - d * WHEEL_PUSH));
}, { passive: false });

// touch: drag the strip with a finger — it follows the finger, then glides on with the flick
const gallery = document.querySelector('.gallery');
const FLING_MAX = 60;              // fastest a flick can throw the strip (px per frame)
let drag = null, justDragged = false;
gallery.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;   // desktop keeps the hover / wheel controls
  drag = { id: e.pointerId, startX: e.clientX, lastX: e.clientX, lastT: performance.now(), v: 0, moved: false };
  justDragged = false;
  wheelSpeed = 0;
});
gallery.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.abs(e.clientX - drag.startX) > 6) {
    drag.moved = true;
    drag.lastX = e.clientX;
    gallery.setPointerCapture(e.pointerId);
  }
  if (!drag.moved) return;
  const now = performance.now();
  const dx = e.clientX - drag.lastX;
  position += dx;
  drag.v = dx / Math.max(1, now - drag.lastT) * 16.6667;   // px per frame, for the flick
  drag.lastX = e.clientX; drag.lastT = now;
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.moved) {
    justDragged = true;
    // a recent flick keeps going; a finger that stopped before lifting doesn't
    const v = performance.now() - drag.lastT < 80 ? drag.v : 0;
    wheelSpeed = Math.max(-FLING_MAX, Math.min(FLING_MAX, v));
  }
  drag = null;
};
gallery.addEventListener('pointerup', endDrag);
gallery.addEventListener('pointercancel', endDrag);
// a drag shouldn't open the card it ended on
gallery.addEventListener('click', e => { if (justDragged) { e.preventDefault(); justDragged = false; } }, true);

function animate(now) {
  // gallery
  const dt = Math.max(0, Math.min((now - last) / 16.6667, 2));
  last = now;
  currentSpeed += (targetSpeed - currentSpeed) * .05;
  wheelSpeed *= Math.pow(.9, dt);  // wheel / flick momentum fades out smoothly
  if (!(drag && drag.moved)) position += (currentSpeed + wheelSpeed) * dt;
  // seamless loop: one set = from the first card to the first card of the second set
  const kids = track.children, L = POSTERS.length;
  const period = kids[L] ? kids[L].offsetLeft - kids[0].offsetLeft : track.scrollWidth / 3;
  if (position > 0) position -= period;
  else if (position < -period) position += period;
  track.style.transform = `translate3d(${position}px,0,0)`;

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
